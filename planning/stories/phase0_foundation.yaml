        story: "As a Super-Admin, I want to define roles and per-section permission overrides so access matches RFP §3.1's minimum seven-role set plus any additional roles we need."
        acceptance_criteria: "Role and permission editor lets a Super-Admin create/edit roles and assign per-section read/write/approve/money permissions; a 'what can this role see and do' preview is available; the Treasurer/Pathshala-coordinator/Communications-chair scenarios from RFP §4.4.1 are each configurable without code changes."
