        acceptance_criteria: "TestFlight internal testing group created in App Store Connect (up to 100 App Store Connect users, no Apple review needed); the JCA committee's Apple IDs are added as internal testers; a build distributed via EAS Submit appears on their devices without a manual upload step. External testing (public link, up to 10,000 testers, requires a lightweight Beta App Review) is documented as the path for the wider pre-launch beta in Store & Launch Readiness."
