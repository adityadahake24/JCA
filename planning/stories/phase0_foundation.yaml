        story: "As the vendor, I want JCA enrolled in the Google Play Console as an organization developer account so we can use Play's testing tracks and, later, publish to the Play Store."
        acceptance_criteria: "Google Play Console organization account created and verified under JCA's legal entity; the one-time developer registration fee is paid from JCA's account; vendor engineers are added with scoped Play Console access."
        subtasks:
          - "Complete Google Play Console organization verification under JCA"
