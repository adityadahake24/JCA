phase_key: phase0
phase_name: "Phase 0 — Foundation"

modules:
  - sheet_name: "UI-UX Design - Mobile"
    module: "UI/UX Design — Mobile"
    sprint: "S1-S2"
    sprint_weeks: "Weeks 1-4"
    sprint_complexity: "Very High"
    gate: "Design review — 28 mobile screens signed off with the corrected, AA-compliant palette"
    stories:
      - id: "DES-M-1"
        story: "As the design lead, I want to extract and formalize the design-token set from jca-ny-app_vSHARE.html so every surface builds against one authoritative palette."
        acceptance_criteria: "Token file published (colors, type, spacing, radii, shadows) matching vSHARE; jca-app-mockup.html and jca-admin-mocukups.html palettes formally marked superseded; sign-off recorded from JCA project committee per RFP §2.3."
        subtasks:
          - "Diff vSHARE vs jca-app-mockup vs admin-mockup token sets"
          - "Write the palette-conflict resolution memo (Discovery item DISC-8)"
          - "Publish packages/tokens source file (JSON/YAML) consumed by web, admin, and RN"
        surfaces: ["iOS", "Android", "Web", "Admin"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "DES-M-2"
        story: "As the design lead, I want the gold token family remediated for WCAG 2.1 AA so no on-brand color choice silently fails accessibility."
        acceptance_criteria: "New --gold-text token (#7d6229, 5.34:1 vs cream) introduced; gold and gold-light restricted to ornamental/non-text use in the component library; contrast table (Discovery item DISC-10) reviewed and signed off."
        subtasks:
          - "Compute contrast ratios for every token against cream and paper backgrounds"
          - "Introduce --gold-text and document the 'gold is ornament, crimson is text' rule"
          - "Update Figma color styles and component variants to enforce the rule"
        surfaces: ["iOS", "Android", "Web", "Admin"]
        priority: "Critical"
        complexity: "Low"
        status: "Ready"
      - id: "DES-M-3"
        story: "As a designer, I want all 28 mobile screens redrawn in Figma against the corrected tokens so engineering has a pixel-accurate, accessible source of truth."
        acceptance_criteria: "All 28 screens from the walkthrough deck present in Figma with corrected tokens applied; each screen annotated with the navigation paths from the walkthrough; JCA committee review completed."
        subtasks:
          - "Recreate all 28 screens (Home, Live Darshan, Calendar, Donate flows, Community, Profile/More, etc.)"
          - "Annotate navigation paths per the walkthrough deck's 'How to Navigate' sections"
          - "Run a design-review session with the JCA project committee"
        surfaces: ["iOS", "Android"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "DES-M-4"
        story: "As a designer, I want dark-mode variants for Live Darshan and Virtual Tour so the meditative viewing context is honored as specified."
        acceptance_criteria: "Dark-mode screens for Live Darshan (5 shrine streams) and Virtual Tour designed using the same brand tokens; contrast verified in dark mode."
        subtasks:
          - "Design dark-mode Live Darshan screen with PiP and stream selector"
          - "Design dark-mode Virtual Tour with 360° hotspot overlay"
          - "Verify AA contrast for all dark-mode text/icon combinations"
        surfaces: ["iOS", "Android"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "DES-M-5"
        story: "As a designer, I want Dynamic Type and platform font-scaling verified across representative screens so multi-generational accessibility (ages 5-90+) is honored."
        acceptance_criteria: "Home, Donate, and Family/Dues screens verified at 100%, 150%, and 200% text scale on iOS and Android without truncation or overlap; tap targets meet platform minimums at every scale."
        subtasks:
          - "Test Dynamic Type scaling on iOS reference screens"
          - "Test font-scale accessibility settings on Android reference screens"
          - "Document minimum tap-target sizes in the component spec"
        surfaces: ["iOS", "Android"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "DES-M-6"
        story: "As a designer, I want a Jain iconography set (siddhachakra, aṣṭamaṅgala, ratnatraya, swastika) so the visual identity is unambiguously Jain, not Hindu."
        acceptance_criteria: "Icon set delivered as SVG/vector assets for all five icon families; no Om, Ganesha, or trishul iconography present anywhere in the set; JCA committee confirms religious accuracy."
        subtasks:
          - "Source/commission the five core Jain icon families"
          - "Build the five-shrine iconset (Mahavir, Adinath, Upashray, Shrimad, Dadawadi)"
          - "Get religious-accuracy sign-off from JCA committee"
        surfaces: ["iOS", "Android", "Web", "Admin"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "DES-M-7"
        story: "As a designer, I want a motion spec so transitions feel calm and reverent rather than growth-hacky, per the 'calm over flashy' principle."
        acceptance_criteria: "Motion spec documents easing curves, durations, and prohibited patterns (no confetti/gamified animation on member surfaces); applied to the Thank You (donation confirmation) screen as the reference implementation."
        subtasks:
          - "Define easing/duration tokens (calm, deliberate transitions)"
          - "Document prohibited patterns per the 'calm over flashy' RFP principle"
          - "Prototype the Anumodana Thank You screen animation as the reference case"
        surfaces: ["iOS", "Android", "Web"]
        priority: "Medium"
        complexity: "Low"
        status: "Ready"

  - sheet_name: "UI-UX Design - Web and Admin"
    module: "UI/UX Design — Web & Admin"
    sprint: "S2-S3"
    sprint_weeks: "Weeks 3-6"
    sprint_complexity: "High"
    gate: "Design review — responsive web navigation + admin component inventory"
    stories:
      - id: "DES-W-1"
        story: "As a designer, I want a responsive web design system derived from the mobile tokens so brand identity is consistent while layouts adapt to viewport."
        acceptance_criteria: "Breakpoints defined (mobile/tablet/desktop); responsive grid derived from the 5-tab structure as a top navigation bar per RFP §3.3; component library published in Figma with web-specific states (hover, focus-visible)."
        subtasks:
          - "Define breakpoints and responsive grid system"
          - "Design the top-nav bar mirroring the 5 mobile tabs plus public-info area"
          - "Publish web component library (buttons, cards, forms, tables)"
        surfaces: ["Web"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "DES-W-2"
        story: "As a designer, I want a clearly differentiated public-vs-member navigation on web so unauthenticated visitors and signed-in members each see the right experience."
        acceptance_criteria: "Public homepage designed for unauthenticated visitors (info, event browse, donate, newsletter); authenticated member navigation mirrors the 5-tab mobile IA; sign-in CTA placement consistent across public pages."
        subtasks:
          - "Design public homepage and public information pages"
          - "Design authenticated member web dashboard mirroring mobile Home"
          - "Design the sign-in/sign-up entry points across public pages"
        surfaces: ["Web"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "DES-W-3"
        story: "As a designer, I want an admin visual language re-derived from the vSHARE tokens (not the superseded indigo/saffron admin mockup) so the admin utility stays on-brand while remaining dense and productivity-first."
        acceptance_criteria: "Admin theme uses crimson/gold/cream/ink tokens instead of the indigo/saffron mockup; sidebar, nav-groups, and status badges (good/warn/danger) redefined against the new palette; density and layout patterns from the original admin mockup retained where they don't conflict with brand."
        subtasks:
          - "Re-theme the admin mockup's sidebar, nav, and status colors to vSHARE tokens"
          - "Verify AA contrast on all re-themed admin components"
          - "Document the density/spacing scale (--r, --r-sm, --r-lg) carried forward from the original admin mockup"
        surfaces: ["Admin"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "DES-W-4"
        story: "As a designer, I want the admin ⌘K command palette and bulk-action patterns specified so common admin operations are keyboard-first, per RFP §4.4.1."
        acceptance_criteria: "Command palette UI spec covers search-everywhere, quick navigation, and quick actions; bulk-action pattern (checkbox select-all, bulk toolbar) specified for at least one reference list (Members)."
        subtasks:
          - "Design the ⌘K command palette overlay and result list"
          - "Design the bulk-action toolbar pattern for list views"
          - "Specify keyboard shortcuts for the five most common admin operations"
        surfaces: ["Admin"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "DES-W-5"
        story: "As a designer, I want a data-table component spec covering saved filters, sorting, and pagination so every admin list view is built consistently."
        acceptance_criteria: "Data-table spec covers column sort, saved-filter chips, pagination, empty states, and loading states; applied as the reference for the Members & Families list."
        subtasks:
          - "Design the base data-table component with sort/filter/paginate states"
          - "Design saved-filter chip pattern"
          - "Apply the pattern to the Members & Families list as the reference build"
        surfaces: ["Admin"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "DES-W-6"
        story: "As a designer, I want a component inventory audit so I know exactly which components are shared across web, admin, and mobile via packages/tokens versus surface-specific."
        acceptance_criteria: "Component inventory spreadsheet lists every component with a Shared/Surface-specific tag; shared components mapped to their packages/ui implementation target."
        subtasks:
          - "Audit all components across the three Figma files"
          - "Tag each as Shared or Surface-specific"
          - "Hand off the shared list to engineering for packages/ui scaffolding"
        surfaces: ["Web", "Admin", "iOS", "Android"]
        priority: "Medium"
        complexity: "Low"
        status: "Ready"

  - sheet_name: "Architecture and Tech Stack"
    module: "Architecture & Tech Stack"
    sprint: "S1"
    sprint_weeks: "Weeks 1-2"
    sprint_complexity: "High"
    gate: "Internal — architecture decision records approved"
    stories:
      - id: "ARCH-1"
        story: "As the tech lead, I want the stack ratified and recorded as ADRs so every subsequent decision traces back to a documented rationale."
        acceptance_criteria: "ADRs written for web framework, admin frontend, mobile framework, backend framework, database, payments, search, hosting, streaming, and monorepo tooling — matching the Tech Decisions sheet; each ADR includes the offense/defence and a named owner."
        subtasks:
          - "Write one ADR per decision row in the Tech Decisions sheet"
          - "Circulate ADRs to the JCA technical advisor for review per RFP §4.1.1"
          - "File signed-off ADRs in the repository under /docs/adr"
        surfaces: ["Backend", "Web", "Admin", "iOS", "Android"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "ARCH-2"
        story: "As a mobile engineer, I want a spike proving Picture-in-Picture, AirPlay, and Google Cast work in an Expo dev-client build before Live Darshan is scheduled as a feature sprint."
        acceptance_criteria: "A throwaway Expo dev-client build demonstrates PiP on iOS, AirPlay casting to an Apple TV, and Google Cast to a Chromecast, all playing a test HLS stream; findings documented, blocking risks flagged."
        subtasks:
          - "Configure react-native-video v6 with a custom dev client"
          - "Configure react-native-google-cast and verify Cast discovery"
          - "Document build-config gotchas for the eventual Live Darshan sprint"
        surfaces: ["iOS", "Android"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "ARCH-3"
        story: "As the tech lead, I want the monorepo topology (Turborepo + pnpm) scaffolded so every surface shares tokens and the generated API client from day one."
        acceptance_criteria: "Monorepo created with apps/web, apps/admin, apps/mobile, packages/tokens, packages/api-client, packages/validation, and services/api; a shared token change in packages/tokens visibly propagates to a placeholder page in each app."
        subtasks:
          - "Scaffold the pnpm workspace and Turborepo pipeline config"
          - "Create empty apps/* and packages/* with a shared tsconfig base"
          - "Prove token propagation with a trivial color-swap test"
        surfaces: ["Backend", "Web", "Admin", "iOS", "Android"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "ARCH-4"
        story: "As the tech lead, I want environment topology (local, staging, production) defined so every surface and the backend deploy predictably."
        acceptance_criteria: "Environment matrix documents URLs, config sources, and data-isolation rules for local/staging/production across all five deliverables; admin utility staging vs production promotion flow documented per RFP §4.4.2."
        subtasks:
          - "Define environment variable and secrets strategy per environment"
          - "Document the staging-to-production promotion flow for content"
          - "Provision the three GCP projects/environments"
        surfaces: ["Backend", "Web", "Admin"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"

  - sheet_name: "Database Schema and Data Model"
    module: "Database Schema & Data Model"
    sprint: "S2"
    sprint_weeks: "Weeks 3-4"
    sprint_complexity: "High"
    gate: "Schema review — ERD approved, legacy-DB audit complete"
    stories:
      - id: "DB-1"
        story: "As a backend engineer, I want the nine-domain data model designed and reviewed so every subsequent feature sprint builds against a stable schema."
        acceptance_criteria: "ERD covers all nine domains (Identity & Access, Membership, Giving, Sponsorship, Events & Facilities, Community, Content, Education & Seva, Platform Operations) per docs/03-database-schema.md; reviewed by JCA's technical advisor per RFP §4.1.1."
        subtasks:
          - "Draft the ERD for each of the nine domains"
          - "Cross-check every table against RFP §3.4 and §4.5 component requirements"
          - "Circulate for technical-advisor review and incorporate feedback"
        surfaces: ["Backend"]
        priority: "Critical"
        complexity: "Very High"
        status: "Ready"
      - id: "DB-2"
        story: "As a backend engineer, I want the cross-cutting conventions (UUID PKs, soft-delete tombstone, optimistic-locking version column, audit trigger) applied to every table via a shared Django abstract base model."
        acceptance_criteria: "An abstract BaseModel provides id, created_at, updated_at, created_by, updated_by, deleted_at, and version; django-safedelete and django-simple-history wired at the base-model level so every concrete model inherits soft-delete and audit history for free."
        subtasks:
          - "Implement the shared abstract base model"
          - "Wire django-safedelete for the 30-day tombstone/recovery workflow"
          - "Wire django-simple-history for the immutable audit trail"
        surfaces: ["Backend"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "DB-3"
        story: "As a backend engineer, I want the existing database JCA referenced in the RFP audited so we know what, if anything, must be migrated before the new schema is frozen."
        acceptance_criteria: "Discovery item DISC-9 resolved: audit report documents the existing system(s), including the library-book database from RFP §3.4 item 15, its schema, row counts, and export capability; migration-path recommendation delivered."
        subtasks:
          - "Request database access/export from JCA IT contact"
          - "Profile the existing library-book catalog structure and volume"
          - "Write the migration-path recommendation as part of DISC-9"
        surfaces: ["Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "DB-4"
        story: "As a backend engineer, I want baseline Django migrations and seed data so every developer can stand up an identical local database."
        acceptance_criteria: "Initial migration set applies cleanly on a fresh Postgres 16 instance; seed-data fixture populates roles, permissions, the five traditions, and a handful of demo members/events for local development."
        subtasks:
          - "Generate and review the initial migration set"
          - "Write the roles/permissions/traditions seed fixture"
          - "Document the local-dev database bootstrap command"
        surfaces: ["Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "DB-5"
        story: "As a backend engineer, I want pg_trgm and unaccent enabled with indexes on searchable name/content fields so search is typo-tolerant and diacritic-aware from day one."
        acceptance_criteria: "pg_trgm and unaccent extensions enabled on the Postgres instance; trigram indexes added on member_profile.display_name, event.title, and post.body; a manual test query with a typo and a missing diacritic both return the expected row."
        subtasks:
          - "Enable pg_trgm and unaccent extensions via migration"
          - "Add trigram GIN indexes on the identified searchable columns"
          - "Write a smoke test proving typo-tolerant, diacritic-insensitive matches"
        surfaces: ["Backend"]
        priority: "High"
        complexity: "Low"
        status: "Ready"

  - sheet_name: "API Contract and Integration Map"
    module: "API Contract & Integration Map"
    sprint: "S3"
    sprint_weeks: "Weeks 5-6"
    sprint_complexity: "High"
    gate: "Phase 0 exit gate — OpenAPI contract published and approved (RFP §4.1.1, §6.1.1 item 1)"
    stories:
      - id: "API-1"
        story: "As a backend engineer, I want drf-spectacular wired into the Django project so an OpenAPI 3.1 schema is generated automatically from the DRF viewsets and serializers."
        acceptance_criteria: "OpenAPI schema auto-generates at /api/schema/; a Swagger/Redoc UI is reachable in the staging environment; schema includes example payloads for at least the auth and member-profile endpoints."
        subtasks:
          - "Install and configure drf-spectacular"
          - "Annotate initial viewsets with example payloads"
          - "Publish the schema UI to staging"
        surfaces: ["Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "API-2"
        story: "As a frontend engineer, I want a TypeScript API client generated from the OpenAPI schema into packages/api-client so web, admin, and mobile call the backend through one typed interface."
        acceptance_criteria: "A codegen script produces a typed client from the live schema; a change to a backend serializer field is reflected in the generated client on the next codegen run without manual edits; client published as a workspace package consumed by all three frontend apps."
        subtasks:
          - "Select and configure the OpenAPI-to-TypeScript codegen tool"
          - "Wire codegen into the CI pipeline as a drift-check"
          - "Consume the generated client from a placeholder screen in each app"
        surfaces: ["Web", "Admin", "iOS", "Android"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "API-3"
        story: "As a backend engineer, I want an API versioning and deprecation policy documented so breaking changes never surprise a shipped mobile client, per RFP §3.1."
        acceptance_criteria: "Versioning policy documented (URL-prefixed /api/v1/); deprecation window defined (minimum 90 days with a Sunset header); policy referenced in every ADR touching the API surface."
        subtasks:
          - "Document the versioning scheme and deprecation window"
          - "Implement a Sunset-header middleware for deprecated routes"
          - "Add the policy to the onboarding docs for new engineers"
        surfaces: ["Backend"]
        priority: "High"
        complexity: "Low"
        status: "Ready"
      - id: "API-4"
        story: "As a backend engineer, I want a standard error envelope and pagination/filtering convention so every endpoint behaves predictably across all four surfaces."
        acceptance_criteria: "Error responses follow a consistent {code, message, field_errors} shape; list endpoints support cursor-based pagination and a common filter/sort query-param convention; documented in the API contract."
        subtasks:
          - "Implement a shared DRF exception handler for the error envelope"
          - "Implement a shared pagination class"
          - "Document the filtering/sorting query-param convention"
        surfaces: ["Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"

  - sheet_name: "Project Setup and CI-CD"
    module: "Project Setup & CI/CD"
    sprint: "S1-S3"
    sprint_weeks: "Weeks 1-6"
    sprint_complexity: "High"
    gate: "Internal — five green CI pipelines, staging deploys live"
    stories:
      - id: "SETUP-1"
        story: "As a DevOps engineer, I want five project skeletons (backend, web, admin, mobile, infra) created with CI so every surface builds and lints on every push, per RFP §4.1.1."
        acceptance_criteria: "Each skeleton has a passing CI pipeline running build + lint + test on every push; badge visible in each app's README; a trivial change to each surface triggers and passes its pipeline."
        subtasks:
          - "Scaffold the Django backend skeleton with pytest + ruff"
          - "Scaffold the Next.js web skeleton with ESLint + Prettier + TypeScript strict"
          - "Scaffold the Vite admin skeleton with the same linting stack"
          - "Scaffold the Expo mobile skeleton with ESLint + TypeScript strict"
        surfaces: ["Backend", "Web", "Admin", "iOS", "Android"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "SETUP-2"
        story: "As a DevOps engineer, I want reproducible, signed, tagged releases so every deployed artifact traces back to an exact commit."
        acceptance_criteria: "A tagged release produces an identical Docker image digest on a repeat build; releases are cryptographically signed; a release-notes template is used for every tag."
        subtasks:
          - "Pin dependency lockfiles across all five projects"
          - "Configure reproducible Docker builds for the backend"
          - "Set up release signing and the release-notes template"
        surfaces: ["Backend", "Web", "Admin"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "SETUP-3"
        story: "As a DevOps engineer, I want EAS Build profiles configured for the monorepo so iOS and Android builds come from one pipeline without dual-build overhead."
        acceptance_criteria: "eas.json defines development, preview, and production profiles; a build triggered from CI produces both an iOS simulator build and an Android APK from the same commit."
        subtasks:
          - "Configure eas.json profiles for dev/preview/production"
          - "Wire EAS Build into the monorepo's CI trigger"
          - "Verify a dual iOS+Android build from a single commit"
        surfaces: ["iOS", "Android"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "SETUP-4"
        story: "As a DevOps engineer, I want infrastructure as code for the GCP environment so staging and production are provisioned identically and repeatably."
        acceptance_criteria: "Terraform (or equivalent) provisions Cloud Run services, Cloud SQL instance, Cloud Storage buckets, and Secret Manager entries for both staging and production from the same module with environment-specific variables."
        subtasks:
          - "Write Terraform modules for Cloud Run, Cloud SQL, and Cloud Storage"
          - "Parameterize staging vs production variables"
          - "Provision both environments and verify parity"
        surfaces: ["Backend"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "SETUP-5"
        story: "As a DevOps engineer, I want Cloud Build (or equivalent) wired to deploy on merge to main so every accepted change reaches staging without a manual step."
        acceptance_criteria: "A merge to main triggers build, test, and deploy to staging for the affected surface(s) only; a failed pipeline blocks the deploy and notifies the team."
        subtasks:
          - "Configure Cloud Build triggers per surface"
          - "Wire failure notifications to the team channel"
          - "Verify path-based triggers only rebuild affected surfaces"
        surfaces: ["Backend", "Web", "Admin"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"

  - sheet_name: "Auth Identity and RBAC"
    module: "Auth, Identity & RBAC"
    sprint: "S3-S4"
    sprint_weeks: "Weeks 5-8"
    sprint_complexity: "High"
    gate: "Sprint demo — sign-in working end-to-end on all three member surfaces"
    stories:
      - id: "AUTH-1"
        story: "As a member, I want to sign in with Apple, Google, or email/password on any surface so I have one identity everywhere, per RFP §3.1."
        acceptance_criteria: "All three sign-in methods work on iOS, Android, and Web; signing in on one surface and then opening another surface recognizes the same account; django-allauth backs all three providers server-side."
        subtasks:
          - "Wire django-allauth for Apple and Google OAuth"
          - "Implement email/password registration with verification"
          - "Build the sign-in UI on all three member surfaces"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "AUTH-2"
        story: "As a new member, I want registration to capture member-ID linkage, family-record initiation, and gotra so my account starts connected to my family and tradition."
        acceptance_criteria: "Registration flow collects member ID (or issues one), initiates a family record with the registrant as primary, and captures gotra and tradition; all three fields visible on the resulting Profile screen."
        subtasks:
          - "Design and build the registration form with member-ID/family/gotra fields"
          - "Implement member-ID issuance logic for brand-new registrants"
          - "Auto-create the family record on registration completion"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "AUTH-3"
        story: "As an admin, I want an SSO option for admin sign-in so JCA can use its provider of choice for staff authentication, per RFP §3.1."
        acceptance_criteria: "SAML or OIDC SSO configurable in Settings > Integration Credentials; an admin can sign in via the configured SSO provider in addition to email/password."
        subtasks:
          - "Integrate a generic SAML/OIDC SSO connector in the admin app"
          - "Build the SSO configuration UI in admin Settings"
          - "Test against at least one real SSO provider (e.g. Google Workspace SSO)"
        surfaces: ["Admin", "Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "AUTH-4"
        story: "As an admin, I want MFA mandatory at first login so the admin utility meets the security posture confirmed in Discovery (item DISC-4)."
        acceptance_criteria: "An admin cannot complete first login without enrolling an MFA factor (TOTP at minimum); MFA is enforced on every subsequent login; no bypass path exists for any admin role including Super-Admin."
        subtasks:
          - "Implement TOTP-based MFA enrollment and verification"
          - "Enforce MFA at first login with no skip option"
          - "Add MFA re-verification for the two-person money-confirmation flow"
        surfaces: ["Admin", "Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "AUTH-5"
        story: "As a member, I want the option to enable MFA on my account so I can add security if I choose, without it being forced."
        acceptance_criteria: "MFA enrollment is available in Profile > Settings for member accounts; enabling it does not disrupt Sign in with Apple/Google flows; disabling requires re-authentication."
        subtasks:
          - "Expose optional MFA enrollment in member Settings"
          - "Handle MFA verification within the Apple/Google sign-in flow"
          - "Require re-auth before MFA can be disabled"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Medium"
        complexity: "Low"
        status: "Ready"
