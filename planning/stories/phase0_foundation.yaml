  - sheet_name: "Auth Identity and RBAC"
    module: "Auth, Identity & RBAC"
    sprint: "S3-S4"
    sprint_weeks: "Weeks 5-8"
    sprint_complexity: "High"
    gate: "Sprint demo — sign-in working end-to-end on the Expo app (Web + iOS + Android) and in the Payload admin"
    stories:
      - id: "AUTH-1"
        story: "As a member, I want to sign in with Apple, Google, or email/password on any surface so I have one identity everywhere, per RFP §3.1."
        acceptance_criteria: "All three sign-in methods work on iOS, Android, and Web from the single Expo app; signing in on one surface and then opening another surface recognizes the same account; the FastAPI backend issues and validates the session/JWT tokens for all three providers."
        subtasks:
          - "Implement Apple and Google OAuth against the FastAPI backend"
          - "Implement email/password registration with verification"
          - "Build the sign-in UI once in the Expo app, shared across all three surfaces"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "AUTH-2"
        story: "As a new member, I want registration to capture member-ID linkage, family-record initiation, and gotra so my account starts connected to my family and tradition."
        acceptance_criteria: "Registration flow collects member ID (or issues one), initiates a family record with the registrant as primary, and captures gotra and tradition; all three fields visible on the resulting Profile screen."
        subtasks:
          - "Design and build the registration form with member-ID/family/gotra fields"
          - "Implement member-ID issuance logic for brand-new registrants"
          - "Auto-create the family record on registration completion"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "AUTH-3"
        story: "As an admin, I want an SSO option for admin sign-in so JCA can use its provider of choice for staff authentication, per RFP §3.1."
        acceptance_criteria: "SAML or OIDC SSO configurable from a Payload admin settings screen, implemented as a custom Payload authentication strategy (Payload does not ship SSO out of the box); an admin can sign in via the configured SSO provider in addition to Payload's built-in email/password."
        subtasks:
          - "Build a custom Payload authentication strategy for SAML/OIDC SSO"
          - "Build the SSO configuration screen in the Payload admin"
          - "Test against at least one real SSO provider (e.g. Google Workspace SSO)"
        surfaces: ["Admin", "Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "AUTH-4"
        story: "As an admin, I want MFA mandatory at first login so the admin utility meets the security posture confirmed in Discovery (item DISC-4), since Payload does not enforce MFA by default."
        acceptance_criteria: "A custom Payload authentication hook blocks completion of first login until an admin enrolls an MFA factor (TOTP at minimum); MFA is enforced on every subsequent login; no bypass path exists for any admin role including Super-Admin."
        subtasks:
          - "Implement TOTP-based MFA enrollment and verification as a Payload auth hook"
          - "Enforce MFA at first login with no skip option"
          - "Add MFA re-verification for the two-person money-confirmation flow"
        surfaces: ["Admin", "Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "AUTH-5"
        story: "As a member, I want the option to enable MFA on my account so I can add security if I choose, without it being forced."
        acceptance_criteria: "MFA enrollment is available in Profile > Settings for member accounts; enabling it does not disrupt Sign in with Apple/Google flows; disabling requires re-authentication."
        subtasks:
          - "Expose optional MFA enrollment in member Settings"
          - "Handle MFA verification within the Apple/Google sign-in flow"
          - "Require re-auth before MFA can be disabled"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Medium"
        complexity: "Low"
        status: "Ready"
      - id: "AUTH-6"
        story: "As a Super-Admin, I want to define roles and per-section permission overrides without an engineer redeploying code, so access matches RFP §3.1's minimum seven-role set plus any additional roles we need."
        acceptance_criteria: "A Roles collection in Payload, read by a generic access-control layer at runtime, lets a Super-Admin create/edit roles and assign per-section read/write/approve/money permissions — Payload's default access functions are static code, so this dynamic layer is the custom-built piece on top of them; a 'what can this role see and do' preview is available; the Treasurer/Pathshala-coordinator/Communications-chair scenarios from RFP §4.4.1 are each configurable without code changes; member-facing roles (Family Primary, Pathshala Parent, Committee Member) are modeled the same way inside the FastAPI service for app-side permissions."
        subtasks:
          - "Build the Roles collection and the generic runtime access-control layer in Payload"
          - "Implement the matching role system for member-facing roles in FastAPI"
          - "Seed the seven baseline roles (Guest, Member, Family Primary, Pathshala Parent, Committee Member, Admin, Super-Admin) and build the permission-preview feature"
        surfaces: ["Admin", "Backend"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "AUTH-7"
        story: "As a mobile/web engineer, I want tokens stored in the platform keychain/keystore/HttpOnly cookie so credentials never sit in insecure storage, per RFP §5.1."
        acceptance_criteria: "The Expo app on iOS stores tokens in Keychain with the strictest applicable accessibility class; on Android it uses Keystore-backed EncryptedSharedPreferences; the Expo app's web build uses HttpOnly, Secure, SameSite=Lax cookies with CSRF tokens on state-changing requests."
        subtasks:
          - "Implement Keychain-backed token storage on iOS"
          - "Implement Keystore-backed token storage on Android"
          - "Implement HttpOnly/Secure/SameSite cookie sessions with CSRF protection on the web build"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "AUTH-8"
        story: "As a first-time mobile user, I want a first-launch Splash/Welcome screen establishing Jain identity before any utility, so my first impression of the app is reverent, not transactional, per RFP §4.1.2 and the walkthrough's slide 4."
        acceptance_criteria: "Splash shows the JCA logo on an ivory medallion, the Navkar Mantra in a serif face, the ratnatraya ornament, and the five-shrine context (Mahavir, Adinath, Upashray, Shrimad, Dadawadi), with a single Get Started CTA; shown automatically on first open and never again unless the user signs out; the web build of the same Expo app serves the public homepage with a Sign In CTA as its equivalent entry point (no separate splash screen on web)."
        subtasks:
          - "Build the mobile Splash/Welcome screen with the Jain iconography from DES-7"
          - "Implement the first-open-only display logic, reset on sign-out"
          - "Verify the web build's public homepage serves as the equivalent entry point"
        surfaces: ["iOS", "Android", "Web"]
        priority: "Critical"
        complexity: "Low"
        status: "Ready"

