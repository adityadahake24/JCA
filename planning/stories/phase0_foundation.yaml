        acceptance_criteria: "Play Console Internal Testing track live (up to 100 testers, available within minutes, no review) with the JCA committee added as testers; a build distributed via EAS Submit appears on the Internal Testing track without a manual upload step; the Closed Testing track is scoped and scheduled to open with at least 12 opted-in testers running for a continuous 14-day period, since new Play Console accounts must complete this before applying for full production access."
