        acceptance_criteria: "Apple Developer Program organization enrollment completed under JCA's legal entity (D-U-N-S number verified); JCA is the account holder of record; vendor engineers are added as team members with the appropriate roles in App Store Connect."
        subtasks:
          - "Verify or obtain JCA's D-U-N-S number for organization enrollment"
          - "Complete Apple Developer Program organization enrollment ($99/year) under JCA"
          - "Add vendor engineers to App Store Connect with scoped roles"
        surfaces: ["iOS"]
        priority: "Critical"
        complexity: "Low"
        status: "Ready"
