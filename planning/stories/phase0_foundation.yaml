phase_key: phase0
phase_name: "Phase 0 — Foundation"

modules:
  - sheet_name: "UI-UX Design - Web and App"
    module: "UI/UX Design — Web & App"
    sprint: "S1-S3"
    sprint_weeks: "Weeks 1-6"
    sprint_complexity: "Very High"
    gate: "Design review — all screens signed off with the corrected, AA-compliant palette; admin re-skinned inside Payload"
    stories:
      - id: "DES-1"
        story: "As the design lead, I want to extract and formalize the design-token set from jca-ny-app_vSHARE.html so every surface builds against one authoritative palette."
        acceptance_criteria: "Token file published (colors, type, spacing, radii, shadows) matching vSHARE; jca-app-mockup.html and jca-admin-mocukups.html palettes formally marked superseded; sign-off recorded from JCA project committee per RFP §2.3."
        subtasks:
          - "Diff vSHARE vs jca-app-mockup vs admin-mockup token sets"
          - "Write the palette-conflict resolution memo (Discovery item DISC-8)"
          - "Publish packages/tokens source file (JSON/YAML) consumed by the Expo app and the Payload admin theme"
        surfaces: ["iOS", "Android", "Web", "Admin"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "DES-2"
        story: "As the design lead, I want the gold token family remediated for WCAG 2.1 AA so no on-brand color choice silently fails accessibility."
        acceptance_criteria: "New --gold-text token (#7d6229, 5.34:1 vs cream) introduced; gold and gold-light restricted to ornamental/non-text use in the component library; contrast table (Discovery item DISC-10) reviewed and signed off."
        subtasks:
          - "Compute contrast ratios for every token against cream and paper backgrounds"
          - "Introduce --gold-text and document the 'gold is ornament, crimson is text' rule"
          - "Update Figma color styles and component variants to enforce the rule"
        surfaces: ["iOS", "Android", "Web", "Admin"]
        priority: "Critical"
        complexity: "Low"
        status: "Ready"
      - id: "DES-3"
        story: "As a designer, I want all 28 mobile/web screens redrawn in Figma against the corrected tokens, as one responsive design that adapts from phone to desktop, so engineering has a pixel-accurate, accessible source of truth for the single Expo codebase."
        acceptance_criteria: "All 28 screens from the walkthrough deck present in Figma with corrected tokens applied and a responsive spec per screen (phone / tablet / desktop breakpoints, since the same screen ships to iOS, Android, and Web from one Expo build); each screen annotated with the navigation paths from the walkthrough; JCA committee review completed."
        subtasks:
          - "Recreate all 28 screens (Home, Live Darshan, Calendar, Donate flows, Community, Profile/More, etc.) with responsive breakpoints"
          - "Annotate navigation paths per the walkthrough deck's 'How to Navigate' sections"
          - "Run a design-review session with the JCA project committee"
        surfaces: ["iOS", "Android", "Web"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "DES-4"
        story: "As a designer, I want a clearly differentiated public-vs-member navigation for the web surface of the Expo app so unauthenticated visitors and signed-in members each see the right experience."
        acceptance_criteria: "Public homepage designed for unauthenticated visitors (info, event browse, donate, newsletter); authenticated member navigation mirrors the 5-tab mobile IA on web via the same Expo Router layout; sign-in CTA placement consistent across public pages."
        subtasks:
          - "Design the public homepage and public information pages"
          - "Design the authenticated member web dashboard mirroring mobile Home"
          - "Design the sign-in/sign-up entry points across public pages"
        surfaces: ["Web"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "DES-5"
        story: "As a designer, I want dark-mode variants for Live Darshan and Virtual Tour so the meditative viewing context is honored as specified."
        acceptance_criteria: "Dark-mode screens for Live Darshan (5 shrine streams) and Virtual Tour designed using the same brand tokens; contrast verified in dark mode."
        subtasks:
          - "Design dark-mode Live Darshan screen with PiP and stream selector"
          - "Design dark-mode Virtual Tour with 360° hotspot overlay"
          - "Verify AA contrast for all dark-mode text/icon combinations"
        surfaces: ["iOS", "Android"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "DES-6"
        story: "As a designer, I want Dynamic Type and platform font-scaling verified across representative screens so multi-generational accessibility (ages 5-90+) is honored."
        acceptance_criteria: "Home, Donate, and Family/Dues screens verified at 100%, 150%, and 200% text scale on iOS, Android, and the web build without truncation or overlap; tap targets meet platform minimums at every scale."
        subtasks:
          - "Test Dynamic Type scaling on iOS reference screens"
          - "Test font-scale accessibility settings on Android reference screens"
          - "Document minimum tap-target sizes in the component spec"
        surfaces: ["iOS", "Android", "Web"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "DES-7"
        story: "As a designer, I want a Jain iconography set (siddhachakra, aṣṭamaṅgala, ratnatraya, swastika) so the visual identity is unambiguously Jain, not Hindu."
        acceptance_criteria: "Icon set delivered as SVG/vector assets for all five icon families; no Om, Ganesha, or trishul iconography present anywhere in the set; JCA committee confirms religious accuracy."
        subtasks:
          - "Source/commission the five core Jain icon families"
          - "Build the five-shrine iconset (Mahavir, Adinath, Upashray, Shrimad, Dadawadi)"
          - "Get religious-accuracy sign-off from JCA committee"
        surfaces: ["iOS", "Android", "Web", "Admin"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "DES-8"
        story: "As a designer, I want a motion spec so transitions feel calm and reverent rather than growth-hacky, per the 'calm over flashy' principle."
        acceptance_criteria: "Motion spec documents easing curves, durations, and prohibited patterns (no confetti/gamified animation on member surfaces); applied to the Thank You (donation confirmation) screen as the reference implementation."
        subtasks:
          - "Define easing/duration tokens (calm, deliberate transitions)"
          - "Document prohibited patterns per the 'calm over flashy' RFP principle"
          - "Prototype the Anumodana Thank You screen animation as the reference case"
        surfaces: ["iOS", "Android", "Web"]
        priority: "Medium"
        complexity: "Low"
        status: "Ready"
      - id: "DES-9"
        story: "As a designer, I want a component inventory noting which components live in the shared packages/ui library (consumed by both the Expo app and the Payload admin theme) versus surface-specific, so nothing gets designed twice."
        acceptance_criteria: "Component inventory spreadsheet lists every component with a Shared/Surface-specific tag; shared components mapped to their packages/ui implementation target; Payload-theme components (which restyle Payload's built-in UI rather than being built from scratch) are marked distinctly from Expo-app components."
        subtasks:
          - "Audit components across the Figma files and the Payload admin defaults"
          - "Tag each as Shared, Expo-app-specific, or Payload-theme-only"
          - "Hand off the shared list to engineering for packages/ui scaffolding"
        surfaces: ["Web", "Admin", "iOS", "Android"]
        priority: "Medium"
        complexity: "Low"
        status: "Ready"
      - id: "DES-10"
        story: "As a designer, I want Payload's admin panel re-skinned with JCA's crimson/gold/cream brand — logo, color theme, and typography — rather than a custom admin UI designed from scratch, since Payload already ships the sidebar, tables, search, and bulk-action patterns the RFP's admin requirements call for."
        acceptance_criteria: "Payload's admin theme uses crimson/gold/cream/ink tokens instead of Payload's default styling; JCA logo and wordmark applied to the admin login and sidebar; AA contrast verified on the re-themed components; the original indigo/saffron admin mockup is formally marked superseded per Discovery item DISC-8, not carried forward even as a starting point."
        subtasks:
          - "Apply the packages/tokens palette to Payload's admin theme configuration"
          - "Replace Payload's default branding with JCA's logo/wordmark on login and sidebar"
          - "Verify AA contrast on every re-themed Payload UI element"
        surfaces: ["Admin"]
        priority: "Critical"
        complexity: "Low"
        status: "Ready"

  - sheet_name: "Cloud Architecture and Platform Setup"
    module: "Cloud Architecture & Platform Setup"
    sprint: "S1-S3"
    sprint_weeks: "Weeks 1-6"
    sprint_complexity: "Very High"
    gate: "Phase 0 exit gate — architecture ratified, schema frozen, API contract published, CI green on all three project skeletons (RFP §4.1.1, §6.1.1 item 1)"
    stories:
      - id: "ARCH-1"
        story: "As the tech lead, I want the stack ratified and recorded as ADRs so every subsequent decision traces back to a documented rationale."
        acceptance_criteria: "ADRs written for the unified UI framework (Expo), the admin/content layer (Payload CMS), the backend framework (FastAPI), database, payments, search, hosting, streaming, and monorepo tooling — matching the Tech Decisions sheet; each ADR includes the offense/defence and a named owner."
        subtasks:
          - "Write one ADR per decision row in the Tech Decisions sheet"
          - "Circulate ADRs to the JCA technical advisor for review per RFP §4.1.1"
          - "File signed-off ADRs in the repository under /docs/adr"
        surfaces: ["Backend", "Web", "Admin", "iOS", "Android"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "ARCH-2"
        story: "As a mobile engineer, I want a spike proving Picture-in-Picture, AirPlay, and Google Cast work in an Expo dev-client build before Live Darshan is scheduled as a feature sprint."
        acceptance_criteria: "A throwaway Expo dev-client build demonstrates PiP on iOS, AirPlay casting to an Apple TV, and Google Cast to a Chromecast, all playing a test HLS stream; findings documented, blocking risks flagged."
        subtasks:
          - "Configure react-native-video v6 with a custom dev client"
          - "Configure react-native-google-cast and verify Cast discovery"
          - "Document build-config gotchas for the eventual Live Darshan sprint"
        surfaces: ["iOS", "Android"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "ARCH-3"
        story: "As the tech lead, I want the monorepo topology (Turborepo + pnpm) scaffolded so every surface shares tokens and the generated API client from day one."
        acceptance_criteria: "Monorepo created with apps/expo (Web + iOS + Android), apps/admin (Payload CMS), packages/tokens, packages/ui, packages/api-client, and services/api (FastAPI); a shared token change in packages/tokens visibly propagates to a placeholder screen in the Expo app and a placeholder page in the Payload admin theme."
        subtasks:
          - "Scaffold the pnpm workspace and Turborepo pipeline config"
          - "Create empty apps/* and packages/* with a shared tsconfig base"
          - "Prove token propagation with a trivial color-swap test across the Expo app and Payload theme"
        surfaces: ["Backend", "Web", "Admin", "iOS", "Android"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "ARCH-4"
        story: "As the tech lead, I want environment topology (local, staging, production) defined so every surface and both backend services deploy predictably."
        acceptance_criteria: "Environment matrix documents URLs, config sources, and data-isolation rules for local/staging/production across the Expo app, the Payload admin app, and the FastAPI service; admin utility staging vs production promotion flow (including Payload content promotion) documented per RFP §4.4.2."
        subtasks:
          - "Define environment variable and secrets strategy per environment"
          - "Document the staging-to-production promotion flow for Payload-authored content"
          - "Provision the three GCP projects/environments"
        surfaces: ["Backend", "Web", "Admin"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "DB-1"
        story: "As a backend engineer, I want the nine-domain data model designed and reviewed so every subsequent feature sprint builds against a stable schema."
        acceptance_criteria: "ERD covers all nine domains (Identity & Access, Membership, Giving, Sponsorship, Events & Facilities, Community, Content, Education & Seva, Platform Operations) per docs/03-database-schema.md, split between Payload-owned content collections and FastAPI-owned transactional tables; reviewed by JCA's technical advisor per RFP §4.1.1."
        subtasks:
          - "Draft the ERD for each of the nine domains, marking Payload vs. FastAPI ownership per table"
          - "Cross-check every table against RFP §3.4 and §4.5 component requirements"
          - "Circulate for technical-advisor review and incorporate feedback"
        surfaces: ["Backend"]
        priority: "Critical"
        complexity: "Very High"
        status: "Ready"
      - id: "DB-2"
        story: "As a backend engineer, I want the cross-cutting conventions (UUID PKs, soft-delete tombstone, optimistic-locking version column, audit trail) applied to every FastAPI-owned table via a shared SQLAlchemy base model, since FastAPI doesn't bundle these the way Django's ecosystem does."
        acceptance_criteria: "A shared SQLAlchemy declarative base/mixin provides id, created_at, updated_at, created_by, updated_by, deleted_at, and version on every business table; a companion audit-log table records every state-changing write with actor and before/after values; Alembic migration generates all of it cleanly on a fresh database."
        subtasks:
          - "Implement the shared SQLAlchemy base-model mixin"
          - "Implement the 30-day tombstone/recovery soft-delete convention"
          - "Implement the audit-log table and the write-path hook that populates it"
        surfaces: ["Backend"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "DB-3"
        story: "As a backend engineer, I want baseline Alembic migrations and seed data so every developer can stand up an identical local Postgres database for both the FastAPI service and Payload."
        acceptance_criteria: "Initial FastAPI migration set (Alembic) and Payload's own migration/config apply cleanly on a fresh Postgres 16 instance; seed-data fixtures populate roles, permissions, the five traditions, and a handful of demo members/events for local development."
        subtasks:
          - "Generate and review the initial Alembic migration set"
          - "Write the roles/permissions/traditions seed fixture"
          - "Document the local-dev database bootstrap command for both services"
        surfaces: ["Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "DB-4"
        story: "As a backend engineer, I want pg_trgm and unaccent enabled with indexes on searchable name/content fields so search is typo-tolerant and diacritic-aware from day one."
        acceptance_criteria: "pg_trgm and unaccent extensions enabled on the Postgres instance; trigram indexes added on member_profile.display_name, event.title, and post.body; a manual test query with a typo and a missing diacritic both return the expected row."
        subtasks:
          - "Enable pg_trgm and unaccent extensions via migration"
          - "Add trigram GIN indexes on the identified searchable columns"
          - "Write a smoke test proving typo-tolerant, diacritic-insensitive matches"
        surfaces: ["Backend"]
        priority: "High"
        complexity: "Low"
        status: "Ready"
      - id: "API-1"
        story: "As a backend engineer, I want FastAPI's native OpenAPI 3.1 schema generation wired up and published so the frontend contract is always in sync with the actual routes, with no separate schema-generation library to maintain."
        acceptance_criteria: "OpenAPI schema auto-generates at /openapi.json straight from FastAPI route and Pydantic-model type hints; a Swagger/Redoc UI is reachable in the staging environment; schema includes example payloads for at least the auth and member-profile endpoints."
        subtasks:
          - "Configure FastAPI's OpenAPI metadata and example payloads"
          - "Annotate initial routers/Pydantic models with example payloads"
          - "Publish the schema UI to staging"
        surfaces: ["Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "API-2"
        story: "As a frontend engineer, I want a TypeScript API client generated from the FastAPI OpenAPI schema, plus a typed client for Payload's REST/GraphQL content API, into packages/api-client, so the Expo app calls both backends through one typed interface."
        acceptance_criteria: "A codegen script produces a typed client from FastAPI's live schema and a typed client from Payload's generated types; a change to a FastAPI Pydantic model or a Payload collection field is reflected in the generated client on the next codegen run without manual edits; both clients are published as one workspace package consumed by the Expo app."
        subtasks:
          - "Select and configure the OpenAPI-to-TypeScript codegen tool for FastAPI"
          - "Wire Payload's built-in TypeScript type generation into the same package"
          - "Wire both codegen steps into the CI pipeline as a drift-check"
        surfaces: ["Web", "Admin", "iOS", "Android"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "API-3"
        story: "As a backend engineer, I want an API versioning and deprecation policy documented so breaking changes never surprise a shipped mobile client, per RFP §3.1."
        acceptance_criteria: "Versioning policy documented (URL-prefixed /api/v1/); deprecation window defined (minimum 90 days with a Sunset header); policy referenced in every ADR touching the API surface."
        subtasks:
          - "Document the versioning scheme and deprecation window"
          - "Implement a Sunset-header middleware for deprecated routes"
          - "Add the policy to the onboarding docs for new engineers"
        surfaces: ["Backend"]
        priority: "High"
        complexity: "Low"
        status: "Ready"
      - id: "API-4"
        story: "As a backend engineer, I want a standard error envelope and pagination/filtering convention so every FastAPI endpoint behaves predictably across all surfaces."
        acceptance_criteria: "Error responses follow a consistent {code, message, field_errors} shape; list endpoints support cursor-based pagination and a common filter/sort query-param convention; documented in the API contract."
        subtasks:
          - "Implement a shared FastAPI exception handler for the error envelope"
          - "Implement a shared pagination dependency"
          - "Document the filtering/sorting query-param convention"
        surfaces: ["Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "SETUP-1"
        story: "As a DevOps engineer, I want three project skeletons — the FastAPI backend, the Payload admin/CMS app, and the single Expo app — created with CI so every surface builds and lints on every push, per RFP §4.1.1."
        acceptance_criteria: "Each of the three skeletons has a passing CI pipeline running build + lint + test on every push; badge visible in each app's README; a trivial change to each surface triggers and passes its pipeline."
        subtasks:
          - "Scaffold the FastAPI backend skeleton with pytest + ruff"
          - "Scaffold the Payload admin/CMS skeleton with its Postgres adapter"
          - "Scaffold the single Expo app skeleton (Web + iOS + Android) with ESLint + TypeScript strict"
        surfaces: ["Backend", "Web", "Admin", "iOS", "Android"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "SETUP-2"
        story: "As a DevOps engineer, I want reproducible, signed, tagged releases so every deployed artifact traces back to an exact commit."
        acceptance_criteria: "A tagged release produces an identical Docker image digest on a repeat build for both the FastAPI service and the Payload app; releases are cryptographically signed; a release-notes template is used for every tag."
        subtasks:
          - "Pin dependency lockfiles across all three projects"
          - "Configure reproducible Docker builds for the FastAPI service and Payload app"
          - "Set up release signing and the release-notes template"
        surfaces: ["Backend", "Admin"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "SETUP-3"
        story: "As a DevOps engineer, I want EAS Build profiles configured for the monorepo so iOS, Android, and web builds all come from one Expo pipeline without dual-build overhead."
        acceptance_criteria: "eas.json defines development, preview, and production profiles for iOS, Android, and web export; a build triggered from CI produces an iOS simulator build, an Android APK, and a web bundle from the same commit."
        subtasks:
          - "Configure eas.json profiles for dev/preview/production across all three targets"
          - "Wire EAS Build into the monorepo's CI trigger"
          - "Verify a combined iOS + Android + web build from a single commit"
        surfaces: ["iOS", "Android", "Web"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "SETUP-4"
        story: "As a DevOps engineer, I want infrastructure as code for the GCP environment so staging and production are provisioned identically and repeatably."
        acceptance_criteria: "Terraform (or equivalent) provisions Cloud Run services for both the FastAPI backend and the Payload admin app, a shared Cloud SQL instance, Cloud Storage buckets, and Secret Manager entries for both staging and production from the same module with environment-specific variables."
        subtasks:
          - "Write Terraform modules for the two Cloud Run services, Cloud SQL, and Cloud Storage"
          - "Parameterize staging vs production variables"
          - "Provision both environments and verify parity"
        surfaces: ["Backend"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "SETUP-5"
        story: "As a DevOps engineer, I want Cloud Build (or equivalent) wired to deploy on merge to main so every accepted change reaches staging without a manual step."
        acceptance_criteria: "A merge to main triggers build, test, and deploy to staging for the affected surface(s) only (FastAPI, Payload, or the Expo app); a failed pipeline blocks the deploy and notifies the team."
        subtasks:
          - "Configure Cloud Build triggers per surface"
          - "Wire failure notifications to the team channel"
          - "Verify path-based triggers only rebuild affected surfaces"
        surfaces: ["Backend", "Admin"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"

  - sheet_name: "Data Migration Planning"
    module: "Data Migration Planning"
    sprint: "S2-S3"
    sprint_weeks: "Weeks 3-6"
    sprint_complexity: "Medium"
    gate: "Schema review — legacy-data audit complete and migration plan signed off before the schema is frozen"
    stories:
      - id: "MIG-1"
        story: "As a backend engineer, I want the existing database(s) referenced in the RFP audited so we know what, if anything, must be migrated before the new schema is frozen."
        acceptance_criteria: "Discovery item DISC-9 resolved: audit report documents the existing system(s), including the library-book database from RFP §3.4 item 15, its schema, row counts, and export capability; migration-path recommendation delivered."
        subtasks:
          - "Request database access/export from JCA IT contact"
          - "Profile the existing library-book catalog structure and volume"
          - "Write the migration-path recommendation as part of DISC-9"
        surfaces: ["Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "MIG-2"
        story: "As the JCA project committee, I want a field-by-field data-mapping sign-off so we agree, in writing, which legacy fields map to the new schema and which are intentionally dropped, before any data moves."
        acceptance_criteria: "A mapping document lists every legacy field (member records, library catalog, any donation history found) against its destination in the new schema or an explicit 'not migrated' decision with a stated reason; JCA project committee signs off before the migration script is written."
        subtasks:
          - "Draft the field-by-field mapping document from the MIG-1 audit"
          - "Walk the mapping through with the JCA project committee"
          - "File the signed-off mapping alongside the frozen schema"
        surfaces: ["Backend"]
        priority: "High"
        complexity: "Low"
        status: "Ready"
      - id: "MIG-3"
        story: "As a backend engineer, I want a rehearsed one-time ETL script with a dry run and a rollback plan so cutover from legacy data happens on a known-good schedule, not a live scramble."
        acceptance_criteria: "ETL script runs successfully against a copy of the legacy data into a staging database; a dry-run report shows row counts in vs. out per table with any rejected/unmapped rows flagged; a documented rollback plan restores the pre-migration state if the cutover run fails partway."
        subtasks:
          - "Write the ETL script against the signed-off MIG-2 mapping"
          - "Run and validate a full dry run against staging"
          - "Document and rehearse the rollback plan"
        surfaces: ["Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"

  - sheet_name: "Payment Provider Setup"
    module: "Payment Provider Setup"
    sprint: "S1-S2"
    sprint_weeks: "Weeks 1-4"
    sprint_complexity: "Medium"
    gate: "Internal — both processor accounts verified, sandbox keys in the credentials vault, webhooks test-fired"
    stories:
      - id: "PAYSETUP-1"
        story: "As JCA's Treasurer, I want a Stripe account created and verified under JCA's 501(c)(3) EIN so nonprofit processing rates and payout banking are confirmed before any payment feature is built."
        acceptance_criteria: "Stripe account is created under JCA's legal entity, EIN, and bank account; nonprofit discounted-rate status is applied and confirmed; account is fully verified (no outstanding Stripe requirements) before the Payments & Billing sprint begins."
        subtasks:
          - "Complete Stripe's business/nonprofit verification with JCA's EIN and bank details"
          - "Apply for and confirm Stripe's nonprofit processing rate"
          - "Confirm payout bank account and payout schedule with JCA's Treasurer"
        surfaces: ["Backend"]
        priority: "Critical"
        complexity: "Low"
        status: "Ready"
      - id: "PAYSETUP-2"
        story: "As JCA's Treasurer, I want a PayPal Commerce Platform business account set up as the secondary payment rail so members who prefer PayPal are covered per the RFP requirement."
        acceptance_criteria: "PayPal Commerce Platform business account created under JCA's legal entity; account verified and linked to JCA's bank account; live API credentials available for integration."
        subtasks:
          - "Create and verify the PayPal Commerce Platform business account"
          - "Link JCA's bank account for payouts"
          - "Confirm live API credentials are issued"
        surfaces: ["Backend"]
        priority: "Critical"
        complexity: "Low"
        status: "Ready"
      - id: "PAYSETUP-3"
        story: "As a backend engineer, I want sandbox/test-mode API keys for both Stripe and PayPal provisioned into the credentials vault early so payment feature sprints aren't blocked waiting on account approval."
        acceptance_criteria: "Stripe and PayPal sandbox/test-mode keys are stored in Secret Manager and referenced from the credentials vault before the Payments & Billing sprint starts; a test charge and a test PayPal payment both succeed against sandbox from a throwaway script."
        subtasks:
          - "Provision Stripe and PayPal sandbox keys into Secret Manager"
          - "Wire the credentials vault to reference (not store) these secrets"
          - "Run a throwaway smoke test charge against each sandbox"
        surfaces: ["Backend"]
        priority: "High"
        complexity: "Low"
        status: "Ready"
      - id: "PAYSETUP-4"
        story: "As JCA's Treasurer, I want webhook endpoints and payout bank details test-verified for both processors so real donations settle into JCA's bank account correctly from day one."
        acceptance_criteria: "Stripe and PayPal webhook endpoints are registered and receive a successful test event from each processor's dashboard; a test payout completes to JCA's actual bank account in sandbox/test mode where the processor supports it, confirming account and routing details are correct."
        subtasks:
          - "Register and test-fire Stripe and PayPal webhook endpoints"
          - "Verify payout bank account and routing details with a test payout where supported"
          - "Document the webhook and payout configuration for the Payments & Billing sprint"
        surfaces: ["Backend"]
        priority: "High"
        complexity: "Low"
        status: "Ready"

  - sheet_name: "App Delivery Platform Enrollment"
    module: "App Delivery Platform Enrollment"
    sprint: "S1-S2"
    sprint_weeks: "Weeks 1-4"
    sprint_complexity: "Low"
    gate: "Internal — both developer accounts enrolled, internal testing tracks live, EAS pipeline pushing builds to both"
    stories:
