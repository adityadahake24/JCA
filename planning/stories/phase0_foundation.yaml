        acceptance_criteria: "iOS stores tokens in Keychain with the strictest applicable accessibility class; Android uses Keystore-backed EncryptedSharedPreferences; web sessions use HttpOnly, Secure, SameSite=Lax cookies with CSRF tokens on state-changing requests."
        subtasks:
