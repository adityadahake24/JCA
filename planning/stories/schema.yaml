# Database Schema — organized into nine domains. Every table carries the
# cross-cutting conventions below unless noted otherwise.
#
# Cross-cutting conventions (not repeated per table):
#   - UUID primary key
#   - created_at, updated_at, created_by, updated_by
#   - deleted_at (soft-delete tombstone; RFP §4.4.1 — 30-day recovery window)
#   - version (integer, optimistic locking; RFP §4.4.1 — multi-admin safety)
#   - An audit_log entry is written on every INSERT/UPDATE/DELETE that
#     originates from the admin utility (RFP §4.4.1, §4.5.3)

domains:
  - name: "Identity & Access"
    tables:
      - table: "user"
        purpose: "One record per real person — the single source of identity RFP §3.1 requires."
        key_columns: "email, phone, display_name, preferred_locale, status"
        fks: "—"
        phase: "phase0"
      - table: "auth_identity"
        purpose: "Linked external identity per sign-in method (Apple, Google, email/password)."
        key_columns: "provider, provider_subject_id, user_id"
        fks: "user_id -> user"
        phase: "phase0"
      - table: "mfa_factor"
        purpose: "Registered MFA factors — mandatory for admin, optional for members."
        key_columns: "user_id, factor_type, secret_ref, verified_at"
        fks: "user_id -> user"
        phase: "phase0"
      - table: "role"
        purpose: "The role catalog: Guest, Member, Family Primary, Pathshala Parent, Committee Member, Admin, Super-Admin, plus any Vendor-proposed additions."
        key_columns: "name, description"
        fks: "—"
        phase: "phase0"
      - table: "permission"
        purpose: "Granular per-section permission catalog (read / write / approve / money) per admin section."
        key_columns: "section, action"
        fks: "—"
        phase: "phase0"
      - table: "role_permission"
        purpose: "Role-to-permission grants, with per-record override support."
        key_columns: "role_id, permission_id, scope_override"
        fks: "role_id -> role, permission_id -> permission"
        phase: "phase0"
      - table: "user_role"
        purpose: "User-to-role assignment, many-to-many (a Committee Member can also be a Family Primary)."
        key_columns: "user_id, role_id"
        fks: "user_id -> user, role_id -> role"
        phase: "phase0"
      - table: "session"
        purpose: "Active session per device/surface, backing HttpOnly/Secure/SameSite web cookies and mobile refresh tokens."
        key_columns: "user_id, surface, device_info, expires_at, revoked_at"
        fks: "user_id -> user"
        phase: "phase0"
      - table: "audit_log"
        purpose: "Immutable, append-only log of every state-changing operation. Retained seven years. Never updated or deleted by application code."
        key_columns: "actor_user_id, action_type, target_table, target_id, before_state, after_state, second_actor_user_id"
        fks: "actor_user_id -> user, second_actor_user_id -> user (nullable, two-person rule)"
        phase: "phase0"

  - name: "Membership"
    tables:
      - table: "member_profile"
        purpose: "Member-specific fields layered on user — member ID, gotra, tradition affiliation."
        key_columns: "user_id, member_id, tradition_id, gotra, joined_date"
        fks: "user_id -> user, tradition_id -> tradition"
        phase: "phase0"
      - table: "tradition"
        purpose: "The five Jain traditions housed at JCA — used everywhere equal-visibility is required (Live Darshan, Calendar, religious content)."
        key_columns: "name (Shvetambara Murtipujak, Shvetambara Sthanakvasi, Shvetambara Terapanthi, Digambar, Shrimad Rajchandra)"
        fks: "—"
        phase: "phase0"
      - table: "family"
        purpose: "One family record grouping related members."
        key_columns: "family_name, primary_member_id"
        fks: "primary_member_id -> member_profile"
        phase: "phase1"
      - table: "family_member"
        purpose: "Individual within a family — includes non-user children too young to have accounts."
        key_columns: "family_id, relationship, dob, gotra, has_user_account"
        fks: "family_id -> family, user_id -> user (nullable)"
        phase: "phase1"
      - table: "membership_tier"
        purpose: "Tier catalog (e.g. Standard, Patron, Lifetime) with pricing and renewal rules."
        key_columns: "name, annual_price, is_lifetime"
        fks: "—"
        phase: "phase1"
      - table: "membership"
        purpose: "A member's current tier, since-date, and renewal date."
        key_columns: "member_profile_id, tier_id, since_date, renewal_date, status"
        fks: "member_profile_id -> member_profile, tier_id -> membership_tier"
        phase: "phase1"
      - table: "dues_item"
        purpose: "A single billable line (annual membership, MJK pass, Pathshala term fee)."
        key_columns: "family_id, item_type, description, amount, due_date"
        fks: "family_id -> family"
        phase: "phase1"
      - table: "dues_ledger_entry"
        purpose: "Ledger of dues issued / paid / comped / waived / refunded, running balance."
        key_columns: "dues_item_id, entry_type, amount, admin_actor_id, second_actor_id"
        fks: "dues_item_id -> dues_item, admin_actor_id -> user, second_actor_id -> user (nullable)"
        phase: "phase1"

  - name: "Giving"
    tables:
      - table: "cause"
        purpose: "A giving cause (General, Maintenance, Bhojanshala, Pathshala, Jeev Daya, Restoration if confirmed active)."
        key_columns: "name, description, goal_amount, raised_amount, is_active, linked_event_id"
        fks: "linked_event_id -> event (nullable, for event-based prioritization)"
        phase: "phase1"
      - table: "donation"
        purpose: "A single donation transaction (one-time)."
        key_columns: "cause_id, donor_user_id, amount, is_anonymous, memorial_text, payment_transaction_id"
        fks: "cause_id -> cause, donor_user_id -> user (nullable if off-platform), payment_transaction_id -> payment_transaction"
        phase: "phase1"
      - table: "donation_allocation"
        purpose: "Supports a donation split across multiple causes or an event-tied goal."
        key_columns: "donation_id, cause_id, amount"
        fks: "donation_id -> donation, cause_id -> cause"
        phase: "phase1"
      - table: "recurring_subscription"
        purpose: "A recurring giving plan — daily aarti dāna, monthly general fund, yearly Paryushan dāna."
        key_columns: "user_id, cause_id, amount, frequency, next_charge_date, status, stripe_subscription_id"
        fks: "user_id -> user, cause_id -> cause"
        phase: "phase1"
      - table: "payment_method"
        purpose: "Saved payment method reference — tokenized only, never a raw card number (PCI)."
        key_columns: "user_id, provider, provider_payment_method_id, brand, last4"
        fks: "user_id -> user"
        phase: "phase1"
      - table: "payment_transaction"
        purpose: "Provider-agnostic transaction record — one row per Stripe or PayPal charge attempt."
        key_columns: "provider, provider_transaction_id, amount, currency, status, idempotency_key"
        fks: "payment_method_id -> payment_method (nullable)"
        phase: "phase1"
      - table: "refund"
        purpose: "A refund against a payment_transaction — requires two admin actors per the money rule."
        key_columns: "payment_transaction_id, amount, reason, initiating_actor_id, confirming_actor_id"
        fks: "payment_transaction_id -> payment_transaction, initiating_actor_id -> user, confirming_actor_id -> user"
        phase: "phase1"
      - table: "receipt"
        purpose: "Generated 501(c)(3) tax receipt PDF for a donation, including JCA EIN and required disclosure language."
        key_columns: "donation_id, pdf_url, issued_at"
        fks: "donation_id -> donation"
        phase: "phase1"
      - table: "year_end_statement"
        purpose: "Consolidated annual giving statement per member, and institution-wide for admin reporting."
        key_columns: "member_profile_id, tax_year, pdf_url, generated_at"
        fks: "member_profile_id -> member_profile"
        phase: "phase1"

  - name: "Sponsorship"
    tables:
      - table: "sponsorship"
        purpose: "A sponsorship record generalized across Tithi, Pooja/Abhishek, Bhojanshala, and event sponsorship."
        key_columns: "sponsorship_type, target_id, donation_id, is_anonymous, memorial_text"
        fks: "donation_id -> donation"
        phase: "phase1"
      - table: "tithi_slot"
        purpose: "A sponsorable tithi date on the calendar, per the Sponsor a Tithi flow."
        key_columns: "tithi_date, tier, is_available"
        fks: "—"
        phase: "phase1"
      - table: "pooja_slot"
        purpose: "Daily pooja/abhishek slot, per tradition, sponsorable."
        key_columns: "date, tradition_id, slot_time, sponsor_id, is_open"
        fks: "tradition_id -> tradition, sponsor_id -> sponsorship (nullable)"
        phase: "phase1"
      - table: "bhojanshala_slot"
        purpose: "A kitchen-calendar date with meal-type tiers (full lunch, sweet box, snack seva)."
        key_columns: "date, meal_tier, sponsor_id, meal_count"
        fks: "sponsor_id -> sponsorship (nullable)"
        phase: "phase1"
      - table: "event_sponsorship_tier"
        purpose: "Sponsorship tiers configured per event (e.g. Gold/Silver/Bronze swamivatsalya)."
        key_columns: "event_id, tier_name, amount, slots_available"
        fks: "event_id -> event"
        phase: "phase1"

  - name: "Events & Facilities"
    tables:
      - table: "event"
        purpose: "Unified event schema — Religious, Cultural, and Educational categories all share this table."
        key_columns: "title, category, description, hero_media_id, rsvp_cap, linked_cause_id"
        fks: "hero_media_id -> media_asset, linked_cause_id -> cause (nullable)"
        phase: "phase1"
      - table: "event_category"
        purpose: "Category catalog (Religious / Cultural / Educational) — admin-managed."
        key_columns: "name"
        fks: "—"
        phase: "phase1"
      - table: "event_schedule_block"
        purpose: "A time block within an event's full schedule (e.g. abhishek at 9am, snatra puja at 11am)."
        key_columns: "event_id, start_time, end_time, label"
        fks: "event_id -> event"
        phase: "phase1"
      - table: "rsvp"
        purpose: "A member's RSVP to an event, with waitlist support."
        key_columns: "event_id, user_id, status (confirmed/waitlisted/cancelled), party_size"
        fks: "event_id -> event, user_id -> user"
        phase: "phase1"
      - table: "attendance"
        purpose: "Day-of check-in record — supports member-ID scan, name search, and walk-in capture."
        key_columns: "event_id, user_id (nullable for walk-ins), checked_in_at, checked_in_by"
        fks: "event_id -> event, user_id -> user (nullable), checked_in_by -> user"
        phase: "phase1"
      - table: "facility"
        purpose: "A bookable facility (Main Hall, Upashray, Marble Lobby) with member-rate pricing."
        key_columns: "name, capacity, member_rate, policy_text"
        fks: "—"
        phase: "phase1"
      - table: "facility_booking"
        purpose: "A hall reservation with approval workflow and deposit tracking."
        key_columns: "facility_id, requested_by, date, status, deposit_amount, deposit_paid"
        fks: "facility_id -> facility, requested_by -> user"
        phase: "phase1"

  - name: "Community"
    tables:
      - table: "post"
        purpose: "A community feed post — admin announcement (auto-published) or member post (gated by moderation)."
        key_columns: "author_id, body, status (pending/approved/declined), pinned"
        fks: "author_id -> user"
        phase: "phase1"
      - table: "post_media"
        purpose: "Media attachments on a post."
        key_columns: "post_id, media_asset_id"
        fks: "post_id -> post, media_asset_id -> media_asset"
        phase: "phase1"
      - table: "post_reaction"
        purpose: "A reaction on a post."
        key_columns: "post_id, user_id, reaction_type"
        fks: "post_id -> post, user_id -> user"
        phase: "phase1"
      - table: "moderation_action"
        purpose: "Audit trail of every moderation decision (approve/decline/edit/flag) — feeds the immutable audit log."
        key_columns: "post_id, admin_actor_id, action, reason"
        fks: "post_id -> post, admin_actor_id -> user"
        phase: "phase1"
      - table: "badge"
        purpose: "Badge catalog (Youth, Pathshala) assignable to users, shown on posts and profiles."
        key_columns: "name, description"
        fks: "—"
        phase: "phase1"
      - table: "content_report"
        purpose: "A member-submitted report against a post, routed to the moderation queue."
        key_columns: "post_id, reported_by, reason, status"
        fks: "post_id -> post, reported_by -> user"
        phase: "phase1"

  - name: "Content"
    tables:
      - table: "announcement"
        purpose: "Admin-authored announcement — pinned in feed, pushed to notifications on publish."
        key_columns: "title, body, publish_at, unpublish_at, segment_id"
        fks: "segment_id -> segment (nullable)"
        phase: "phase1"
      - table: "thought_of_day"
        purpose: "Home dashboard's Thought of the Day content, one per date."
        key_columns: "date, text, source_attribution"
        fks: "—"
        phase: "phase1"
      - table: "quiz_question"
        purpose: "Daily quiz question bank."
        key_columns: "question_text, choices, correct_choice_index, active_date"
        fks: "—"
        phase: "phase1"
      - table: "quiz_attempt"
        purpose: "A member's daily quiz attempt, feeding the streak counter."
        key_columns: "user_id, quiz_question_id, is_correct, attempted_at"
        fks: "user_id -> user, quiz_question_id -> quiz_question"
        phase: "phase1"
      - table: "news_article"
        purpose: "Curated long-form article, distinct from the real-time community feed."
        key_columns: "title, body, category, published_at"
        fks: "—"
        phase: "phase1"
      - table: "newsletter_issue"
        purpose: "A newsletter issue with archive support."
        key_columns: "issue_number, title, body, sent_at"
        fks: "—"
        phase: "phase1"
      - table: "page"
        purpose: "Static/lightly-dynamic CMS page (About Us, Contact, Help) with version control."
        key_columns: "slug, title, body, version"
        fks: "—"
        phase: "phase1"
      - table: "faq"
        purpose: "FAQ entries with a managed taxonomy."
        key_columns: "category, question, answer, sort_order"
        fks: "—"
        phase: "phase1"
      - table: "policy_doc"
        purpose: "JCA Policies — authored, versioned, published (Phase 2)."
        key_columns: "title, body, version, published_at"
        fks: "—"
        phase: "phase2"
      - table: "meeting_minute"
        purpose: "Board / Executive Committee / General Body meeting minutes — gated, searchable, PDF (Phase 2)."
        key_columns: "meeting_type, meeting_date, pdf_url, gated"
        fks: "—"
        phase: "phase2"
      - table: "media_asset"
        purpose: "Uploaded media (image, PDF, audio) stored in S3/CloudFront, referenced across many content types."
        key_columns: "storage_url, mime_type, alt_text, uploaded_by"
        fks: "uploaded_by -> user"
        phase: "phase0"

  - name: "Education & Seva"
    tables:
      - table: "pathshala_class"
        purpose: "A Pathshala class with a term schedule and assigned teacher."
        key_columns: "grade_level, term_id, teacher_user_id, schedule"
        fks: "teacher_user_id -> user"
        phase: "phase1"
      - table: "enrollment"
        purpose: "A child's enrollment in a Pathshala class, with term-fee status."
        key_columns: "family_member_id, pathshala_class_id, term_fee_status"
        fks: "family_member_id -> family_member, pathshala_class_id -> pathshala_class"
        phase: "phase1"
      - table: "lesson"
        purpose: "A lesson published to a class, with materials."
        key_columns: "pathshala_class_id, title, lesson_date"
        fks: "pathshala_class_id -> pathshala_class"
        phase: "phase1"
      - table: "material"
        purpose: "Downloadable material attached to a lesson."
        key_columns: "lesson_id, media_asset_id"
        fks: "lesson_id -> lesson, media_asset_id -> media_asset"
        phase: "phase1"
      - table: "volunteer_opportunity"
        purpose: "An open volunteer opportunity (Bhojanshala, Pathshala, Festival, Setup/Cleanup)."
        key_columns: "title, category, commitment, date, capacity"
        fks: "—"
        phase: "phase1"
      - table: "volunteer_signup"
        purpose: "A member's sign-up for an opportunity."
        key_columns: "volunteer_opportunity_id, user_id, status"
        fks: "volunteer_opportunity_id -> volunteer_opportunity, user_id -> user"
        phase: "phase1"
      - table: "volunteer_hour_log"
        purpose: "Admin-entered hour log in v1.0; member self-entry deferred to Phase 2 consideration per RFP §3.4 item 10."
        key_columns: "user_id, hours, logged_by, activity_date"
        fks: "user_id -> user, logged_by -> user"
        phase: "phase1"
      - table: "service_award"
        purpose: "Service Awards Program — nominations, recipients, eligibility (Phase 2)."
        key_columns: "nominee_user_id, nominated_by, status, award_year"
        fks: "nominee_user_id -> user, nominated_by -> user"
        phase: "phase2"

  - name: "Platform Operations"
    tables:
      - table: "notification_template"
        purpose: "Reusable templates for receipts, dues reminders, RSVP confirmations, sign-in alerts."
        key_columns: "name, channel, subject, body_template"
        fks: "—"
        phase: "phase1"
      - table: "notification_campaign"
        purpose: "A composed, scheduled push/email send."
        key_columns: "template_id, segment_id, scheduled_at, sent_at, status"
        fks: "template_id -> notification_template, segment_id -> segment"
        phase: "phase1"
      - table: "segment"
        purpose: "A saved recipient segment built from filter criteria (tab, tradition, family role, Pathshala enrollment, tier)."
        key_columns: "name, filter_definition (jsonb)"
        fks: "—"
        phase: "phase1"
      - table: "device_token"
        purpose: "Registered push token per device (APNs/FCM/Web Push)."
        key_columns: "user_id, platform, token, active"
        fks: "user_id -> user"
        phase: "phase1"
      - table: "delivery_receipt"
        purpose: "Per-notification, per-surface delivery metrics (sent/delivered/opened/bounced/opted-out)."
        key_columns: "notification_campaign_id, user_id, channel, status"
        fks: "notification_campaign_id -> notification_campaign, user_id -> user"
        phase: "phase1"
      - table: "notification_preference"
        purpose: "Per-member, per-category notification opt-in/opt-out (includes birthday/anniversary opt-in per family member)."
        key_columns: "user_id, category, channel, enabled"
        fks: "user_id -> user"
        phase: "phase1"
      - table: "feature_flag"
        purpose: "Feature-flag console backing — staff/committee/percentage/full rollout stages."
        key_columns: "key, rollout_stage, rollout_percentage"
        fks: "—"
        phase: "phase1"
      - table: "localization_string"
        purpose: "Centralized translation catalog — one row per key/locale, per RFP §3.1."
        key_columns: "key, locale, value, reviewed_by"
        fks: "—"
        phase: "phase0"
      - table: "integration_credential"
        purpose: "Encrypted-at-rest vault entry for payment/push/email/streaming/SSO credentials — Super-Admin only."
        key_columns: "provider, credential_ref (AWS Secrets Manager pointer), rotated_at"
        fks: "—"
        phase: "phase0"
      - table: "tombstone"
        purpose: "Central index of soft-deleted records across all tables, backing the 30-day trash/recovery UI."
        key_columns: "table_name, record_id, deleted_by, deleted_at, purge_at"
        fks: "deleted_by -> user"
        phase: "phase0"
