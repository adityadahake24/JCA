# Discovery & Open Items — resolved during Phase 0 (Sprints 1-3).
# Includes the seven formally-unresolved RFP §4.6 items plus two findings
# from our own review of the source material (palette conflict, legacy DB).

items:
  - id: "DISC-1"
    item: "Education — module boundary"
    source: "RFP §4.6"
    question: "Is Education a top-level module distinct from Pathshala, Jain Philosophy, and Lectures, or a wrapper/umbrella around them?"
    recommendation: "Treat as a wrapper: an 'Education' entry point in the More grid that surfaces Pathshala, Jain Philosophy (Phase 3), and Lectures as sub-destinations, rather than a fourth parallel content system."
    owner: "JCA project committee + Vendor IA lead"
    resolve_by_sprint: "S2"
  - id: "DISC-2"
    item: "Religious activities — synonym or separate module?"
    source: "RFP §4.6"
    question: "Is 'Religious activities' a synonym for Events / Cultural / Daily Pooja & Abhishek, or a separate module? Treated as P1 pending Discovery."
    recommendation: "Fold into the existing Events category taxonomy (Religious / Cultural / Educational, per §3.4 item 3) rather than building a parallel module — avoids duplicate calendar surfaces."
    owner: "JCA project committee"
    resolve_by_sprint: "S1"
  - id: "DISC-3"
    item: "Restoration — active campaign?"
    source: "RFP §4.6"
    question: "Is Restoration an active fundraising campaign? If so, integrate as an event-based Donate cause."
    recommendation: "If confirmed active, model as a standard Cause with an optional linked Event, using the existing event-based goal-prioritization mechanism — no new donation type needed."
    owner: "JCA Treasurer / Donations chair"
    resolve_by_sprint: "S2"
  - id: "DISC-4"
    item: "MFA scope"
    source: "RFP §4.6, §4.1.3"
    question: "MFA priority is unmarked. Confirm mandatory for Admin, optional for members."
    recommendation: "Admin utility: MFA mandatory at first login, no bypass. Member surfaces: MFA optional, offered at signup and configurable per role in Profile > Settings."
    owner: "JCA project committee (security posture sign-off)"
    resolve_by_sprint: "S3"
  - id: "DISC-5"
    item: "Private Events Information — gating rule"
    source: "RFP §4.6 (P2)"
    question: "Confirm membership-gating rule: tier-based, family-role-based, or committee-based?"
    recommendation: "Tier-based as the default rule (matches the existing Membership tier model everywhere else); family-role and committee-based overrides available per-event via the Event editor's existing sponsorship-tier pattern."
    owner: "JCA Events chair"
    resolve_by_sprint: "S20 (Phase 2 kickoff)"
  - id: "DISC-6"
    item: "Skip to Content — accessibility equivalent"
    source: "RFP §4.6 (P2)"
    question: "Propose the platform-native accessibility equivalent per surface."
    recommendation: "iOS: VoiceOver rotor with landmark navigation. Android: TalkBack heading/landmark navigation. Web: a visually-hidden, focus-visible 'Skip to main content' link as the first focusable element on every page."
    owner: "Vendor accessibility lead"
    resolve_by_sprint: "S3"
  - id: "DISC-7"
    item: "Youth — scope distinct from Pathshala and YJA"
    source: "RFP §4.6 (P2)"
    question: "Confirm scope distinct from Pathshala (under 18) and YJA Programs (18-25); confirm whether age-gating is required."
    recommendation: "Youth = ages 13-25, overlapping the top of Pathshala and the start of YJA by design (per the walkthrough's stated 13-25 range) — age-gating required for youth-specific social/mentorship content, self-attested at signup with parental consent under 18."
    owner: "JCA project committee"
    resolve_by_sprint: "S24 (Phase 2, Youth & YJA sprint)"
  - id: "DISC-8"
    item: "Design-system palette conflict — crimson/gold vs. indigo/saffron"
    source: "Vendor review of source materials, not in RFP text"
    question: "jca-ny-app_vSHARE.html uses crimson/gold/cream (RFP §2.2-compliant: 'never saffron/orange'). jca-app-mockup.html and the entire admin mockup use indigo/saffron. The walkthrough deck also references 'calm indigo + saffron.' Which is authoritative?"
    recommendation: "vSHARE (crimson/gold) is authoritative per explicit RFP text. The indigo/saffron admin mockup and jca-app-mockup.html are superseded design-exploration artifacts. Admin visual language is re-derived from the vSHARE tokens in Sprint 2-3, not carried forward as-is."
    owner: "JCA project committee (design sign-off required per RFP §2.3)"
    resolve_by_sprint: "S1"
  - id: "DISC-9"
    item: "Legacy database — scope and migration path"
    source: "RFP §1.1 ('Existing database already available'), §3.4 item 15 (library-book DB)"
    question: "What system currently holds member/donation data (if any) and the library-book catalog? What is its schema, size, and export format?"
    recommendation: "Full audit and migration-path proposal delivered before the Sprint 2 schema is frozen. If no meaningful existing member database is found beyond the library catalog, treat the library-book DB as the only real migration source and design a one-time ETL into the new schema."
    owner: "Vendor backend lead + JCA IT contact"
    resolve_by_sprint: "S2"
  - id: "DISC-10"
    item: "Design-system contrast failure — gold on cream"
    source: "Vendor accessibility review of vSHARE tokens, not in RFP text"
    question: "RFP §2.2 mandates WCAG 2.1 AA everywhere. Measured: --gold #c9a961 on --cream #faf6ef = 2.09:1 (fail); --gold-deep #8c6f30 on --cream = 4.40:1 (fails AA body text by a narrow margin, passes large text only). How should gold be used to stay both on-brand and compliant?"
    recommendation: "Adopt a corrected token set: gold restricted to ornamental use (borders, icons, dividers, large display type ≥24px) never body text; introduce an AA-safe '--gold-text' (~#7d6229, 5.5:1+ on cream) for any place gold-colored text is needed. Documented as a hard rule in the design system, not a per-screen judgment call."
    owner: "Vendor design lead"
    resolve_by_sprint: "S1"
