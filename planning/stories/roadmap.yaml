# Phase & sprint roadmap — relative labelling (no calendar dates).
# Cadence: 2-week sprints. Team shape: 6-8 people (1 PM/BA, 1 designer,
# 2 backend, 2 web/admin, 2 React Native, 1 QA) with parallel surface tracks.
#
# `kickoff_note` documents how this scales for other team sizes, per the
# Summary sheet requirement.

kickoff_note: >
  Sprint numbers and week ranges below assume a 6-8 person team running fully
  parallel surface tracks from Sprint 1. A 3-4 person team cannot run design,
  backend, web, and mobile in parallel with the same depth: expect Phase 1 to
  extend from ~19 sprints to ~30-32 sprints (modules become mostly sequential,
  one or two in flight at a time). A 10-12 person team with a dedicated
  admin-utility pod can compress Phase 1 to ~14-15 sprints, but coordination
  overhead and design-review turnaround become the new bottleneck rather than
  raw implementation capacity.

phases:
  - key: phase0
    name: "Phase 0 — Foundation"
    sprint_range: "Sprints 1–3"
    week_range: "Weeks 1–6"
    goal: "Discovery resolved, design system locked, skeletons deployed, auth working — gates all feature work per RFP §4.1.1."
  - key: phase1
    name: "Phase 1 — v1.0 (initial launch)"
    sprint_range: "Sprints 4–19"
    week_range: "Weeks 7–38"
    goal: "Every P1 feature live on iOS, Android, Web, and Admin. App Store + Play Store approved. Public web launched. RFP §4.1."
  - key: phase2
    name: "Phase 2 — v1.5 (should-have follow-on)"
    sprint_range: "Sprints 20–27"
    week_range: "Weeks 39–54"
    goal: "Member-gated content, governance transparency, richer educational resources. Hindi/Gujarati fully populated. RFP §4.2."
  - key: phase3
    name: "Phase 3 — v2.0 (nice-to-have, contingent)"
    sprint_range: "Sprints 28–31 (+ parallel AI Chat workstream)"
    week_range: "Weeks 55–62 (+10 wks AI Chat)"
    goal: "Educational depth and intelligent assistance. Contingent on Phase 1 and Phase 2 acceptance gates. RFP §4.3."

sprints:
