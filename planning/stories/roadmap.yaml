    phase: phase0
    weeks: "Weeks 1–2"
    modules: ["UI/UX Design — Mobile", "Architecture & Tech Stack", "Project Setup & CI/CD", "Discovery & Open Items"]
    goal: "Kick off design-token extraction, ratify the stack, stand up five empty repos with CI, open every Discovery question."
    complexity: "High"
    gate: "Internal — repo + CI skeleton demo to JCA project committee"
  - id: "S2"
    phase: phase0
    weeks: "Weeks 3–4"
