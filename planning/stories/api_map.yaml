# API <-> Table Map — representative endpoints per module (not exhaustive of
# every possible route). Each row ties an endpoint back to the schema tables
# it touches, the surfaces that call it, the minimum role required, and the
# story that specifies it, so a reviewer can trace contract -> data -> UI.

