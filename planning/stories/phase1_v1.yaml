        story: "As a member, I want Sanskrit/Prakrit terminology and diacritics preserved verbatim in every locale so religious accuracy is never lost in translation, per RFP §5.2."
        acceptance_criteria: "Terms like anumodana, swamivatsalya, dāna, and pratikraman render identically and with correct diacritics regardless of active locale; font stack verified to render diacritics correctly on all platforms."
        subtasks:
          - "Audit font rendering of diacritics across iOS, Android, and web"
          - "Mark Sanskrit/Prakrit terms as non-translatable in the catalog schema"
          - "Verify verbatim rendering across all three active/scaffolded locales"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Critical"
        complexity: "Low"
        status: "Ready"
      - id: "L10N-4"
        story: "As an accessibility auditor, I want a per-surface accessibility audit embedded in the Definition of Done so WCAG 2.1 AA is verified, not assumed, per RFP §4.1.1."
        acceptance_criteria: "Every shipped screen passes an automated accessibility scan plus a manual screen-reader pass (VoiceOver, TalkBack, and a desktop screen reader for web); the Skip to Content equivalents from Discovery item DISC-6 are implemented on all three surfaces; results logged per screen."
        subtasks:
          - "Integrate automated accessibility scanning into CI"
          - "Perform manual VoiceOver/TalkBack/screen-reader passes on representative screens"
          - "Implement the three platform-native Skip to Content equivalents"
        surfaces: ["iOS", "Android", "Web"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "L10N-5"
        story: "As an admin, I want a context-aware translation-catalog management interface so I can manage strings without touching code."
        acceptance_criteria: "Admin Settings section lists every translation key with its English value and locale variants; edits save immediately and propagate per L10N-1's cache-invalidation mechanism."
        subtasks:
          - "Build the translation-catalog management UI in admin Settings"
          - "Wire edits to immediate propagation"
        surfaces: ["Admin", "Backend"]
        priority: "Medium"
        complexity: "Low"
        status: "Ready"

  - sheet_name: "Security Testing and QA"
    module: "Security, Testing & QA"
    sprint: "S16-S17"
    sprint_weeks: "Weeks 31-34"
    sprint_complexity: "High"
    gate: "Pen-test report delivered; High/Critical remediation tracked"
    stories:
      - id: "SEC-1"
        story: "As a developer, I want TLS 1.2+ enforced everywhere with strict ATS/NSC/HSTS/CSP so all network traffic is encrypted and hardened, per RFP §5.1."
        acceptance_criteria: "All traffic redirects to TLS 1.2+; iOS App Transport Security is configured strictly with no exceptions; Android Network Security Config is strict; web enforces HSTS and a strict Content Security Policy by default."
        subtasks:
          - "Configure strict ATS on iOS"
          - "Configure strict Network Security Config on Android"
          - "Configure HSTS and CSP headers on web/backend"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "SEC-2"
        story: "As a developer, I want at least 70% line coverage on business-logic modules across all surfaces, per RFP §5.3."
        acceptance_criteria: "Coverage reports show >=70% on business-logic modules for backend, web, admin, and mobile; coverage gate enforced in CI, blocking merge on regression."
        subtasks:
          - "Audit current coverage gaps across all four surfaces"
          - "Write tests to close gaps to the 70% threshold"
          - "Add the coverage gate to CI"
        surfaces: ["Backend", "Web", "Admin", "iOS", "Android"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "SEC-3"
        story: "As a QA engineer, I want end-to-end tests for the five primary flows (sign-in, donate, dues payment, post-to-community, moderate-a-post) so critical paths never regress silently, per RFP §5.3."
        acceptance_criteria: "E2E suite (Playwright/Detox or equivalent) covers all five flows on the applicable surfaces; suite runs on every PR affecting those flows and blocks merge on failure."
        subtasks:
          - "Write the sign-in and donate E2E tests"
          - "Write the dues-payment, post-to-community, and moderate-a-post E2E tests"
          - "Wire the suite into CI as a merge-blocking check"
        surfaces: ["Backend", "Web", "Admin", "iOS", "Android"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "SEC-4"
        story: "As a developer, I want rate limiting on public-facing APIs and dependency-vulnerability scanning in CI so abuse and known CVEs are caught automatically, per RFP §5.1."
        acceptance_criteria: "Public API routes are IP-rate-limited with a configurable threshold returning 429 when exceeded; every PR runs a dependency scan that blocks merge on a Critical finding; a scheduled weekly full scan runs against main."
        subtasks:
          - "Implement rate limiting on public API routes"
          - "Wire dependency scanning (e.g. Dependabot/Snyk) into CI"
          - "Configure the scheduled weekly full scan"
        surfaces: ["Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "SEC-5"
        story: "As JCA, I want a third-party penetration test conducted before Phase 1 launch with all High and Critical findings remediated, per RFP §5.1 and §6.1.1."
        acceptance_criteria: "An independent third-party pen test is completed against the staging environment covering all four surfaces and the backend; every High and Critical finding is remediated and re-verified before the Phase 1 launch gate."
        subtasks:
          - "Engage and scope the third-party pen-test vendor"
          - "Triage and remediate every High/Critical finding"
          - "Re-verify remediations and file the final pen-test report as a Phase 1 deliverable"
        surfaces: ["Backend", "Web", "Admin", "iOS", "Android"]
        priority: "Critical"
        complexity: "Very High"
        status: "Ready"
      - id: "SEC-6"
        story: "As a member, I want to request full deletion of my account and personal data, with donation records de-linked but IRS-retained, per RFP §5.1."
        acceptance_criteria: "A data-deletion request from Profile > Settings removes personally identifying data from the platform within a defined SLA; donation records remain in JCA's accounting system for IRS-compliance retention but are de-linked from any identifying profile."
        subtasks:
          - "Build the data-deletion request flow"
          - "Implement the de-linking logic for retained donation records"
          - "Document the deletion SLA and retention exception in the privacy policy"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"

