  - sheet_name: "Localization and Accessibility"
    module: "Localization & Accessibility"
    sprint: "S15"
    sprint_weeks: "Weeks 29-30"
    sprint_complexity: "Medium"
    gate: "Sprint demo"
    stories:
      - id: "L10N-1"
        story: "As a backend engineer, I want the centralized translation catalog wired end-to-end so English content renders correctly on all four surfaces from one source, per RFP §3.1 and §5.2."
        acceptance_criteria: "All user-facing strings route through the localization_string catalog; English is fully populated; a string change in the catalog reflects on all surfaces without a client redeploy (cache-invalidated)."
        subtasks:
          - "Wire the localization_string catalog into all four surfaces' rendering layer"
          - "Populate English strings for every screen"
          - "Implement cache invalidation on catalog updates"
        surfaces: ["iOS", "Android", "Web", "Admin", "Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "L10N-2"
        story: "As a translator, I want Hindi and Gujarati scaffolding wired (infrastructure present, not yet populated) so Phase 2 translation work has no engineering dependency."
        acceptance_criteria: "Locale switching mechanism exists and is testable end-to-end with placeholder Hindi/Gujarati strings; the full population of real translations is explicitly out of scope for this sprint and deferred to Phase 2."
        subtasks:
          - "Implement locale-switching infrastructure across all surfaces"
          - "Verify with placeholder Hindi/Gujarati content"
          - "Document the Phase 2 population plan"
        surfaces: ["iOS", "Android", "Web", "Admin", "Backend"]
        priority: "High"
        complexity: "Low"
        status: "Ready"
