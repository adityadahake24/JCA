  - sheet_name: "Admin Governance and Operations"
    module: "Admin — Governance & Operations"
    sprint: "S13"
    sprint_weeks: "Weeks 25-26"
    sprint_complexity: "High"
    gate: "Sprint demo"
    stories:
      - id: "GOV-1"
        story: "As a Super-Admin, I want an immutable, filterable audit log retained for seven years so every state-changing operation is reviewable, per RFP §4.4.1 and §4.5.3."
        acceptance_criteria: "Audit log viewer filters by actor, action type, target record, and time range; entries cannot be edited or deleted through any application code path; export available for board/audit-committee review."
        subtasks:
          - "Build the Audit Log viewer with the four filter dimensions"
          - "Enforce immutability at the database/application layer"
          - "Build the audit-log export"
        surfaces: ["Admin", "Backend"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "GOV-2"
        story: "As an admin, I want a reusable two-person confirmation modal for every money-moving operation so the two-person rule is enforced consistently everywhere, per RFP §4.4.1."
        acceptance_criteria: "One shared component handles refunds, dues comps, manual donation entry, and subscription cancel-on-behalf; the initiating admin's request is visible to a second admin who must authenticate to confirm; both signatures are captured in the audit log."
        subtasks:
          - "Build the shared two-person confirmation modal component"
          - "Wire it into refunds, dues comps, manual donation entry, and subscription cancellation"
          - "Verify both actors are captured in every resulting audit-log entry"
        surfaces: ["Admin", "Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "GOV-3"
        story: "As an admin, I want a soft-delete trash so any deleted record is recoverable for 30 days before a scheduled hard-delete, per RFP §4.4.1."
        acceptance_criteria: "Every deletable record type appears in a searchable trash view within its section; Restore returns it to its prior state; after 30 days an automated job hard-deletes tombstoned records, with legal-retention exceptions for donation records."
        subtasks:
          - "Build the soft-delete trash view per section"
          - "Implement the scheduled hard-delete job with the donation-record retention exception"
          - "Verify restore returns a record to its exact prior state"
        surfaces: ["Admin", "Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "GOV-4"
        story: "As a Super-Admin, I want a feature-flag console for staged rollout (staff, committee, percentage, full) so new features ship safely post-launch, per RFP §4.4.2."
        acceptance_criteria: "Feature flags can be toggled through the four rollout stages; each flag change is audit-logged; a flagged feature is visible only to the intended population at each stage."
        subtasks:
          - "Build the feature-flag console UI"
          - "Implement the four-stage rollout evaluation logic"
          - "Wire flag changes to the audit log"
        surfaces: ["Admin", "Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "GOV-5"
        story: "As a Super-Admin, I want a maintenance-mode toggle with a configurable banner and ETA so planned downtime is communicated clearly, per RFP §4.4.2."
        acceptance_criteria: "Toggling maintenance mode displays a banner with a custom message and ETA across all member-facing surfaces; toggle is Super-Admin only and audit-logged."
        subtasks:
          - "Build the maintenance-mode toggle and banner content editor"
          - "Wire the banner to display across iOS, Android, and web"
        surfaces: ["Admin", "iOS", "Android", "Web", "Backend"]
        priority: "Medium"
        complexity: "Low"
        status: "Ready"
      - id: "GOV-6"
        story: "As a Super-Admin, I want an encrypted integration-credentials vault so payment, push, email, and streaming secrets are managed centrally and never exposed in plaintext, per RFP §4.5.3."
        acceptance_criteria: "Credentials vault stores references to Secret Manager entries, not raw secrets, in the database; only Super-Admin role can view/edit; every credential rotation is audit-logged."
        subtasks:
          - "Build the credentials vault UI backed by Secret Manager references"
          - "Enforce Super-Admin-only access"
          - "Wire rotation events to the audit log"
        surfaces: ["Admin", "Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "GOV-7"
        story: "As a Super-Admin, I want backup/restore visibility with a mandatory confirmation step so I can verify backups are happening and recover from a bad state if needed, per RFP §4.4.2."
        acceptance_criteria: "Admin sees the timestamp of the last successful backup; triggering a restore-from-backup requires explicit Super-Admin confirmation and writes an audit-log entry; a scheduled restore drill can be configured."
        subtasks:
          - "Build the backup-status visibility panel"
          - "Build the restore-from-backup workflow with mandatory confirmation"
          - "Configure automated daily backups on Cloud SQL"
        surfaces: ["Admin", "Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "GOV-8"
        story: "As a Super-Admin, I want a dedicated System-health panel showing backend status, queue depths, third-party-integration health, and recent error rates, with on-call paging, per RFP §4.5.4."
        acceptance_criteria: "System-health panel (distinct from the summary widget on the general Operations Dashboard) shows live backend service status, Celery queue depth, payment/push/email/streaming integration health, and recent error-rate trend; a configurable threshold breach triggers an on-call page."
        subtasks:
          - "Build the System-health panel with the four live status categories"
          - "Wire the recent-error-rate trend chart"
          - "Configure threshold-based on-call paging"
        surfaces: ["Admin", "Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"

