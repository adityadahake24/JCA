phase_key: phase1
phase_name: "Phase 1 — v1.0 (initial launch)"

modules:
  - sheet_name: "Home and Panchang"
    module: "Home & Panchang"
    sprint: "S4"
    sprint_weeks: "Weeks 7-8"
    sprint_complexity: "Medium"
    gate: "Sprint demo"
    stories:
      - id: "HP-1"
        story: "As a member, I want an eight-section Home dashboard so I have a single daily-touch landing page with everything I check each morning."
        acceptance_criteria: "Home renders greeting, Panchang card, Today's Sponsor, Thought of the Day, Daily Quiz, Quick Actions, Center Hours, and Upcoming Events + Feed preview, matching the walkthrough's slide 3; pull-to-refresh updates Panchang and feed."
        subtasks:
          - "Build the eight-section responsive grid layout"
          - "Wire each section to its backend endpoint"
          - "Implement pull-to-refresh on mobile"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "HP-2"
        story: "As a member, I want the daily Jain Panchang (tithi, parva indicator, sunrise, sunset, pratikraman time) cached locally so I can check it even without a connection."
        acceptance_criteria: "Panchang card shows all five data points; mobile caches the last-fetched Panchang for offline display; web shows the same data without requiring sign-in per RFP §4.1.2."
        subtasks:
          - "Build the Panchang data endpoint with a configurable data source"
          - "Implement local offline cache on iOS/Android"
          - "Expose Panchang publicly (unauthenticated) on web"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "HP-3"
        story: "As an admin, I want to configure the Panchang data source and set manual overrides so incorrect calculated data can be corrected without a deploy."
        acceptance_criteria: "Admin Religious Calendar section exposes a Panchang data-source configuration and a manual-override field per date; overrides take effect immediately on all surfaces."
        subtasks:
          - "Build the Panchang data-source config UI"
          - "Implement per-date manual override with immediate propagation"
          - "Add pratikraman-time scheduling controls"
        surfaces: ["Admin", "Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "HP-4"
        story: "As a member, I want a Daily Quiz with a streak counter so I have a reason to open the app every day."
        acceptance_criteria: "One quiz question served per day; answering correctly/incorrectly is recorded once per user per day; a visible streak counter increments on consecutive correct days and resets on a missed day."
        subtasks:
          - "Build the quiz-question serving and answer-recording endpoint"
          - "Implement the streak-calculation logic"
          - "Build the quiz UI with streak display on mobile and web"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "HP-5"
        story: "As an admin, I want to author Thought of the Day content and manage the quiz question bank so Home stays fresh without engineering involvement."
        acceptance_criteria: "Content section lets an admin schedule a Thought of the Day per date and add/edit/retire quiz questions with a correct-answer flag; scheduled publish works for both content types."
        subtasks:
          - "Build the Thought of the Day authoring UI with scheduling"
          - "Build the quiz question bank CRUD UI"
          - "Wire both to scheduled publish"
        surfaces: ["Admin", "Backend"]
        priority: "High"
        complexity: "Low"
        status: "Ready"
      - id: "HP-6"
        story: "As a member, I want Quick Actions and Center Hours with an Open-Now indicator so I can act on the most common tasks and know if the center is open right now."
        acceptance_criteria: "Quick Actions link to Darshan, Donate, Calendar, Gallery, and Volunteer; Center Hours shows today's hours with a live Open/Closed indicator based on the current time."
        subtasks:
          - "Build the Quick Actions tile row with deep links"
          - "Build the Center Hours card with live open/closed calculation"
          - "Wire Center Hours to an admin-editable schedule"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Medium"
        complexity: "Low"
        status: "Ready"

  - sheet_name: "Calendar and Events"
    module: "Calendar & Events"
    sprint: "S5"
    sprint_weeks: "Weeks 9-10"
    sprint_complexity: "Medium"
    gate: "Sprint demo"
    stories:
      - id: "CAL-1"
        story: "As a member, I want a month-grid calendar with festivals, parva days, and JCA events marked so I can see everything happening at a glance."
        acceptance_criteria: "Month grid shows saffron-replaced (brand-compliant) markers for festival/parva days and separate markers for JCA event days per the walkthrough's slide 8; today is highlighted; tapping a day shows that date's events; swipe changes month."
        subtasks:
          - "Build the month-grid calendar component"
          - "Wire festival/parva day markers from the religious calendar data"
          - "Implement day-tap and swipe-to-change-month interactions"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "CAL-2"
        story: "As a member, I want an event detail view with full schedule, location, RSVP, and calendar export so I can commit to attending and add it to my phone."
        acceptance_criteria: "Event detail shows hero image, full multi-block schedule, shrine/location with map preview, RSVP button with live attendee count, sponsor-this-event link, and an add-to-calendar action per the walkthrough's slide 22."
        subtasks:
          - "Build the event detail screen layout"
          - "Implement RSVP with live attendee count"
          - "Implement calendar export (.ics) on mobile and web"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "CAL-3"
        story: "As a member, I want to RSVP to an event and see a waitlist state if it's full so I know where I stand."
        acceptance_criteria: "RSVP button shows Confirmed/Waitlisted/Full based on the RSVP cap; a waitlisted member is promoted automatically if a confirmed spot opens; cancellation frees the spot immediately."
        subtasks:
          - "Implement RSVP cap and waitlist logic"
          - "Implement auto-promotion on cancellation"
          - "Build the RSVP status UI states"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "CAL-4"
        story: "As an admin, I want full event lifecycle management (create, edit, publish, retire) with categories, RSVP cap, and sponsorship tiers so I run every event through one tool."
        acceptance_criteria: "Event editor supports hero media, multi-block schedule, location, category (Religious/Cultural/Educational), RSVP cap, waitlist, sponsorship tiers, and linking a donation cause; publish/retire states are explicit and reversible within the soft-delete window."
        subtasks:
          - "Build the Event editor with all specified fields"
          - "Implement publish/retire state transitions"
          - "Wire the cause-linking control for event-based donation prioritization"
        surfaces: ["Admin", "Backend"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "CAL-5"
        story: "As an admin, I want a calendar conflict view across events, pooja, abhishek, and facility bookings so double-bookings are caught before publish."
        acceptance_criteria: "Conflict view overlays events, religious-calendar slots, and facility bookings on one calendar; a scheduling conflict is visually flagged before an admin can publish the conflicting item."
        subtasks:
          - "Build the cross-section conflict-view calendar component"
          - "Implement conflict-detection logic across the four source types"
          - "Block publish (with an override option) when a conflict is detected"
        surfaces: ["Admin", "Backend"]
        priority: "High"
        complexity: "High"
        status: "Ready"
      - id: "CAL-6"
        story: "As an admin, I want event category management (Religious/Cultural/Educational) so Cultural & Religious events surface correctly as filterable categories per RFP §4.1.2."
        acceptance_criteria: "Category CRUD available in admin; member-facing Calendar supports filtering by category; Cultural events (Garba, plays, music programs) correctly tag as Cultural."
        subtasks:
          - "Build category CRUD in admin"
          - "Add category filter chips to the member-facing Calendar"
          - "Backfill category taxonomy from the RFP's event examples"
        surfaces: ["Admin", "iOS", "Android", "Web"]
        priority: "Medium"
        complexity: "Low"
        status: "Ready"

  - sheet_name: "Content and Newsletter"
    module: "Content & Newsletter"
    sprint: "S5"
    sprint_weeks: "Weeks 9-10"
    sprint_complexity: "Medium"
    gate: "Sprint demo"
    stories:
      - id: "CN-1"
        story: "As an admin, I want to author and schedule announcements that push to all members and pin in the feed so time-sensitive news reaches everyone."
        acceptance_criteria: "Announcement editor supports send-now or schedule-for-later; on publish, a push notification fans out and the announcement auto-pins in the Community Feed; preview renders as it will appear on iOS, Android, and web before publish, per RFP §4.4.1."
        subtasks:
          - "Build the announcement composer with scheduling"
          - "Wire publish to push-notification fan-out and feed pinning"
          - "Build the multi-surface preview"
        surfaces: ["Admin", "iOS", "Android", "Web", "Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "CN-2"
        story: "As a visitor or member, I want About Us, Contact, and Help pages so I can learn JCA's history and get in touch."
        acceptance_criteria: "About Us shows JCA history content; Contact shows address, phone, email, directions, hours, and social links; Help combines FAQ with a contact form that routes submissions to admin."
        subtasks:
          - "Build the About Us, Contact, and Help pages"
          - "Wire the contact form to route submissions into the admin utility"
          - "Make all three pages publicly accessible without sign-in"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Critical"
        complexity: "Low"
        status: "Ready"
      - id: "CN-3"
        story: "As an admin, I want to manage the FAQ taxonomy and route contact-form submissions so Help content stays organized and no inquiry is lost."
        acceptance_criteria: "FAQ entries are categorized and orderable; contact-form submissions appear in an admin queue with status tracking (new/responded/closed)."
        subtasks:
          - "Build the FAQ taxonomy management UI"
          - "Build the contact-form submission queue"
          - "Add status tracking and internal notes to submissions"
        surfaces: ["Admin", "Backend"]
        priority: "Medium"
        complexity: "Low"
        status: "Ready"
      - id: "CN-4"
        story: "As a member, I want a public Board of Trustees and Executive Committee directory so I know who governs JCA."
        acceptance_criteria: "Directory shows name, role, term, opt-in photo, and bio for each member; photo display respects each individual's opt-in flag."
        subtasks:
          - "Build the public roster directory page"
          - "Implement per-member photo opt-in capture in admin"
          - "Wire term tracking so past terms are distinguishable from current"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "High"
        complexity: "Low"
        status: "Ready"
      - id: "CN-5"
        story: "As a member, I want a newsletter archive with the current issue and back issues so I can catch up on anything I missed."
        acceptance_criteria: "Current issue displayed prominently; archive lists back issues chronologically; share and save actions work on mobile and web."
        subtasks:
          - "Build the newsletter archive list and issue-detail view"
          - "Implement share/save actions"
          - "Wire the admin newsletter composer to publish into this archive"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Medium"
        complexity: "Medium"
        status: "Ready"
      - id: "CN-6"
        story: "As a non-member visitor, I want to subscribe to JCA's mailing list from the public web so I can stay informed without creating a full account."
        acceptance_criteria: "Public opt-in form captures email with double opt-in confirmation; subscription integrates with JCA's existing email-marketing tool; admin can view and export the subscriber list."
        subtasks:
          - "Build the public subscribe form with double opt-in"
          - "Integrate with JCA's existing email-marketing tool via API"
          - "Build the admin subscriber-list view with export"
        surfaces: ["Web", "Admin", "Backend"]
        priority: "Medium"
        complexity: "Medium"
        status: "Ready"

  - sheet_name: "Payments and Billing"
    module: "Payments & Billing Infrastructure"
    sprint: "S6"
    sprint_weeks: "Weeks 11-12"
    sprint_complexity: "Very High"
    gate: "Sprint demo — first real charge processed in staging"
    stories:
      - id: "PAY-1"
        story: "As a backend engineer, I want Stripe integrated with Apple Pay, Google Pay, card, and ACH so every donation/dues/sponsorship flow has a working payment rail."
        acceptance_criteria: "Stripe Payment Element live on web; Stripe React Native SDK live on iOS/Android with native Apple Pay and Google Pay sheets; a test charge completes end-to-end and a payment_transaction row is written."
        subtasks:
          - "Integrate Stripe Payment Element on web"
          - "Integrate Stripe RN SDK with Apple Pay and Google Pay on mobile"
          - "Wire webhook handling for payment confirmation"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Critical"
        complexity: "Very High"
        status: "Ready"
      - id: "PAY-2"
        story: "As a backend engineer, I want PayPal Commerce Platform integrated as a second payment rail so the RFP's explicit PayPal requirement is satisfied alongside Stripe."
        acceptance_criteria: "PayPal button/flow available on all donation, dues, and sponsorship checkout screens as an alternative to Stripe; a completed PayPal payment writes the same payment_transaction shape as a Stripe payment."
        subtasks:
          - "Integrate PayPal Commerce Platform SDK on web and mobile"
          - "Normalize PayPal webhook events into the shared payment_transaction model"
          - "Add PayPal as a selectable option on the Payment screen"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "PAY-3"
        story: "As a member, I want an explicit confirmation screen with itemized lines before any charge so I always know exactly what I'm paying for, per RFP §2.2."
        acceptance_criteria: "Every payment flow (donation, dues, sponsorship, subscription, facility deposit) routes through a shared confirmation screen with itemized amount, cause/purpose, and payment method before the charge fires; no charge occurs without this screen."
        subtasks:
          - "Build the shared payment-confirmation screen component"
          - "Wire every payment-initiating flow through this shared component"
          - "Add the Anumodana confirmation language above the Pay button"
        surfaces: ["iOS", "Android", "Web"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "PAY-4"
        story: "As a backend engineer, I want every payment operation to be idempotent so a network retry or double-tap never double-charges a member."
        acceptance_criteria: "Every charge request carries a client-generated idempotency key; a repeated request with the same key returns the original result without creating a second transaction; verified with an automated retry test."
        subtasks:
          - "Implement idempotency-key generation on the client"
          - "Enforce idempotency-key uniqueness on the backend charge endpoint"
          - "Write an automated test simulating a duplicate request"
        surfaces: ["Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "PAY-5"
        story: "As a member, I want a downloadable PDF tax receipt for every donation and a consolidated year-end statement so my 501(c)(3) giving is documented, per RFP §2.2."
        acceptance_criteria: "Every completed donation generates a PDF receipt with JCA's EIN and 'no goods or services' language within seconds of payment; a year-end statement PDF aggregates all giving for a tax year and is downloadable on demand."
        subtasks:
          - "Build the PDF receipt generation service"
          - "Build the year-end statement aggregation and PDF generation"
          - "Wire receipt/statement download buttons across Donation History and Thank You screens"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "PAY-6"
        story: "As an admin, I want to record off-platform donations (cash, check, in-kind) and issue refunds, both gated by the two-person rule, so financial operations stay auditable."
        acceptance_criteria: "Manual donation-entry form generates a receipt identically to an on-platform donation; a refund action requires a second admin's confirmation with their own credentials before it commits; both actions write audit-log entries naming both actors."
        subtasks:
          - "Build the manual donation-entry component"
          - "Build the refund flow with the two-person confirmation modal"
          - "Verify audit-log entries capture both actors for both operations"
        surfaces: ["Admin", "Backend"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"

  - sheet_name: "Admin Shell Dashboards Members"
    module: "Admin — Shell, Dashboards & Members"
    sprint: "S6-S7"
    sprint_weeks: "Weeks 11-14"
    sprint_complexity: "High"
    gate: "Sprint demo"
    stories:
      - id: "ADM-1"
        story: "As an admin, I want a persistent left-side navigation workspace shell so I can move between all 20 admin sections predictably, per RFP §3.4."
        acceptance_criteria: "Sidebar lists all 20 admin sections in the RFP's specified order; active section is visually indicated; sidebar persists across navigation without full-page reload."
        subtasks:
          - "Build the admin app shell with persistent sidebar"
          - "Wire client-side routing for all 20 sections (stubs where features aren't built yet)"
          - "Apply the re-themed admin visual language from DES-W-3"
        surfaces: ["Admin"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "ADM-2"
        story: "As an admin, I want a ⌘K global command palette so I can search and act on anything without hunting through the sidebar, per RFP §4.4.1."
        acceptance_criteria: "⌘K opens a searchable command palette covering navigation targets and quick actions; typing a member name jumps directly to that Member 360 profile; keyboard-only operation works end-to-end."
        subtasks:
          - "Build the command-palette overlay and fuzzy-search index"
          - "Wire navigation and quick-action commands"
          - "Wire global search across members as the first data source"
        surfaces: ["Admin", "Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "ADM-3"
        story: "As an admin, I want an Operations Dashboard home page showing moderation queue depth, donation totals, upcoming events, dues-aging alerts, member growth, and recent audit entries, per RFP §4.5.4."
        acceptance_criteria: "Dashboard renders all six specified widgets with live data; each widget links through to its full section; loads in under 2 seconds on staging with representative seed data."
        subtasks:
          - "Build each of the six dashboard widgets"
          - "Wire each widget's drill-through link"
          - "Add role-based dashboard variants for Treasurer, Communications, Pathshala, Events, Super-Admin"
        surfaces: ["Admin", "Backend"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "ADM-4"
        story: "As an admin, I want a Member 360 view so a member's contact info, family, membership, donations, dues, volunteer hours, Pathshala enrollment, RSVPs, posts, and sign-in audit are all one click away, per RFP §4.5.1."
        acceptance_criteria: "Member 360 is a tabbed single profile page covering all nine listed data categories; every tab loads without navigating away from the profile; used as the destination for Members & Families, Support, and Moderation sections."
        subtasks:
          - "Build the tabbed Member 360 layout"
          - "Wire each of the nine data tabs to its backend source"
          - "Link Member 360 as the drill-through target from search, moderation, and support"
        surfaces: ["Admin", "Backend"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "ADM-5"
        story: "As an admin, I want to bulk-import members via CSV so onboarding JCA's existing congregation doesn't require one-by-one entry, per RFP §4.4.1."
        acceptance_criteria: "CSV upload validates required columns, previews a diff before commit, reports per-row errors without failing the whole batch, and writes one audit-log entry summarizing the import."
        subtasks:
          - "Build the CSV upload and validation UI"
          - "Implement the preview-before-commit step"
          - "Implement per-row error reporting and partial-success handling"
        surfaces: ["Admin", "Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "ADM-6"
        story: "As an admin, I want optimistic locking and real-time presence indicators so two admins editing the same record never silently overwrite each other, per RFP §4.4.1."
        acceptance_criteria: "A record's version column blocks a stale save with a clear conflict message; a moderation-queue post shows 'X is already reviewing this post' when a second admin opens it concurrently."
        subtasks:
          - "Implement optimistic-locking conflict detection on save"
          - "Implement a presence-indicator websocket/polling channel for moderation views"
          - "Build the conflict-resolution UI (reload vs. force-save with warning)"
        surfaces: ["Admin", "Backend"]
        priority: "High"
        complexity: "High"
        status: "Ready"
      - id: "ADM-7"
        story: "As an admin, I want to resolve sign-in support tickets and trigger a password reset for a member so I can help someone locked out without engineering involvement."
        acceptance_criteria: "Admin can search for a member, view their sign-in audit trail, and trigger a password-reset email or unlock an account, with an audit-log entry recorded for the action."
        subtasks:
          - "Build the sign-in support lookup and action panel inside Member 360"
          - "Wire password-reset trigger to the auth service"
          - "Record the support action in the audit log"
        surfaces: ["Admin", "Backend"]
        priority: "Medium"
        complexity: "Low"
        status: "Ready"

  - sheet_name: "Donations and Causes"
    module: "Donations & Causes"
    sprint: "S7"
    sprint_weeks: "Weeks 13-14"
    sprint_complexity: "High"
    gate: "Sprint demo"
    stories:
      - id: "DON-1"
        story: "As a member or visitor, I want a Causes list with progress bars and quick-give amount chips so giving takes one tap, per the walkthrough's slide 10."
        acceptance_criteria: "Causes list shows active causes with progress bar, raised-vs-goal, quick-give chips ($51/$108/$251/$501/$1008/custom), a recurring toggle, and the 501(c)(3) badge; donation is available to unauthenticated visitors on web per RFP §3.4."
        subtasks:
          - "Build the Causes list screen with progress bars and quick-give chips"
          - "Wire recurring toggle to hand off into the Subscriptions flow"
          - "Enable unauthenticated donation on public web"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Critical"
        complexity: "High"
        status: "Ready"
      - id: "DON-2"
        story: "As a member, I want an anonymous toggle and memorial/honoree text field on any donation so I can give privately or in someone's memory, per RFP §2.2 privacy-by-default."
        acceptance_criteria: "Anonymous toggle hides the donor's name from any public recognition surface (Sponsors of the Month, feed); memorial/honoree free-text field appears on the donation form and prints on the receipt when filled."
        subtasks:
          - "Add anonymous toggle and memorial-text field to the donation form"
          - "Enforce anonymity across every public recognition surface"
          - "Include memorial text on the generated PDF receipt"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"
      - id: "DON-3"
        story: "As a member, I want causes tied to upcoming events to automatically rise to the top of the list with a countdown, so event-based giving is prioritized, per RFP §4.1.2."
        acceptance_criteria: "A cause linked to an event shows a countdown to the event date and an event-tied goal-progress bar; linked causes sort above unlinked causes as the event date approaches, per a configurable prioritization window."
        subtasks:
          - "Implement the event-linked cause sorting/prioritization logic"
          - "Build the countdown and event-tied progress-bar UI"
          - "Expose the prioritization-window config to admins"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "DON-4"
        story: "As a member, I want Jeev Daya as a permanent, always-visible cause dedicated to animal welfare, per RFP §4.1.2."
        acceptance_criteria: "Jeev Daya appears in the Causes list at all times regardless of event proximity; admin can link partner-organization information to the cause."
        subtasks:
          - "Seed Jeev Daya as a permanent, non-retirable cause"
          - "Add partner-organization link fields in the admin cause editor"
        surfaces: ["iOS", "Android", "Web", "Admin"]
        priority: "Medium"
        complexity: "Low"
        status: "Ready"
      - id: "DON-5"
        story: "As a member, I want my complete donation history with per-donation receipts and a year-end statement, grouped by year, per the walkthrough's slide 15."
        acceptance_criteria: "History screen shows a YTD total hero card, year-end statement download, year-pill tabs (current/previous/all years), and monthly grouping with a per-row receipt download."
        subtasks:
          - "Build the Donation History screen with year-pill tabs and monthly grouping"
          - "Wire per-row receipt download"
          - "Wire the YTD total and year-end statement download"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "High"
        complexity: "Medium"
        status: "Ready"
      - id: "DON-6"
        story: "As an admin, I want to create, edit, prioritize, and retire causes, and tie causes to events, so the giving catalog stays current."
        acceptance_criteria: "Cause CRUD supports goal amount, description, event linkage, and manual priority override; retiring a cause removes it from member-facing lists while preserving its donation history."
        subtasks:
          - "Build the Causes & Donations admin section CRUD"
          - "Implement the event-linkage control"
          - "Implement retire (soft-delete) with history preservation"
        surfaces: ["Admin", "Backend"]
        priority: "Critical"
        complexity: "Medium"
        status: "Ready"

  - sheet_name: "Recurring Giving and Subscriptions"
    module: "Recurring Giving & Subscriptions"
    sprint: "S8"
    sprint_weeks: "Weeks 15-16"
    sprint_complexity: "High"
    gate: "Sprint demo"
    stories:
      - id: "SUB-1"
        story: "As a member, I want templated recurring-giving plans (Daily Aarti $11, Bhojanshala $108/mo, Paryushan $2,508/yr) so I can set up giving on autopilot in one tap, per the walkthrough's slide 16."
        acceptance_criteria: "Set Up New tab shows the three templates plus a custom-amount/frequency option; selecting a template pre-fills amount and frequency and routes to the payment confirmation screen."
        subtasks:
          - "Build the Set Up New subscription screen with templates"
          - "Wire template selection to the shared payment-confirmation screen"
          - "Create the recurring_subscription record and Stripe Billing subscription on success"
        surfaces: ["iOS", "Android", "Web", "Backend"]
        priority: "Critical"
